<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 링크 공유 시 미리보기(Open Graph) 제목 및 설명 설정 -->
    <title>오늘의 교과서 영단어/문장</title>
    <meta property="og:title" content="오늘의 교과서 영단어/문장">
    <meta property="og:description" content="교과서 영단어와 문장을 재미있는 게임으로 학습해보세요!">
    <meta property="og:type" content="website">

    <!-- 세련된 웹 폰트 (Pretendard) -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 게임용 귀여운 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa; /* 깔끔하고 부드러운 라이트 그레이 배경 */
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #212529; 
        }

        /* ----- 커스텀 모달 (경고/확인창) ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); 
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px); 
        }
        .modal-box {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            border: 1px solid #e9ecef;
        }
        .modal-box p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #343a40;
            font-weight: 600;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .modal-btn {
            background: #4dabf7;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            margin: 0 8px;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(77, 171, 247, 0.2);
        }
        .modal-btn:hover {
            transform: translateY(-2px);
            background: #3bc9db;
            box-shadow: 0 6px 12px rgba(77, 171, 247, 0.3);
        }
        .modal-btn.cancel {
            background: #f1f3f5;
            color: #495057;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .modal-btn.cancel:hover {
            background: #e9ecef;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
        }

        /* ----- 설정 화면 (대시보드 UI) - 가로 와이드 레이아웃 ----- */
        #setup-screen {
            background-color: #ffffff; 
            padding: 40px 50px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 10;
            width: 90%;
            max-width: 1100px; /* 가로로 넓게 설정 */
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        #setup-screen h1 {
            color: #212529;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* 2단 그리드 레이아웃 래퍼 */
        .setup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: #495057;
        }

        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1px solid #ced4da;
            border-radius: 12px;
            box-sizing: border-box;
            background-color: #f8f9fa;
            color: #212529;
            font-family: 'Pretendard', sans-serif;
            transition: all 0.3s ease;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #339af0;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.1);
        }

        .input-group select {
            cursor: pointer;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .info-text {
            font-size: 0.85rem;
            color: #868e96;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        /* 카드형 라디오 버튼 디자인 */
        .mode-selection {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .mode-selection.full-width {
            grid-template-columns: 1fr;
        }

        .mode-label {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            border: 1px solid #ced4da;
            transition: all 0.2s ease;
            color: #495057;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .mode-label input[type="radio"] {
            display: none;
        }

        .mode-label:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #dfe6e9;
        }

        /* 🌟 비활성화된 게임 모드 스타일 🌟 */
        .mode-label.disabled-mode {
            opacity: 0.4;
            pointer-events: none;
            background-color: #f1f3f5;
            border-color: #dee2e6;
            filter: grayscale(100%);
        }

        /* 선택된 게임 모드 스타일 */
        .mode-label:has(input[type="radio"]:checked) {
            border-color: #339af0;
            background-color: #e7f5ff;
            box-shadow: 0 0 0 2px rgba(51, 154, 240, 0.2);
            color: #1864ab;
        }
        .mode-label:has(input[type="radio"]:checked) .mode-title {
            color: #1864ab;
        }

        .mode-title {
            display: block;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
            color: #343a40;
            transition: color 0.2s ease;
        }
        
        .mode-desc {
            font-size: 0.85rem;
            color: #868e96;
        }

        /* 게임 시작 버튼 */
        button.start-btn {
            background-color: #339af0;
            color: #ffffff;
            font-family: 'Pretendard', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            padding: 18px 40px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 16px rgba(51, 154, 240, 0.2);
            align-self: center;
        }
        button.start-btn:hover {
            transform: translateY(-2px);
            background-color: #228be6;
            box-shadow: 0 10px 20px rgba(51, 154, 240, 0.3);
        }

        /* 🌟 모바일 미디어 쿼리 (1단 레이아웃 전환) 🌟 */
        @media (max-width: 850px) {
            .setup-grid { grid-template-columns: 1fr; gap: 0; }
            #setup-screen { padding: 30px 20px; max-height: 85vh; width: 95%;}
            #setup-screen h1 { font-size: 1.8rem; margin-bottom: 20px; }
            .mode-selection { grid-template-columns: 1fr; }
            .flex-mobile-col { flex-direction: column !important; }
            button.start-btn { max-width: 100%; }
        }

        /* ----- 게임 화면 (Game Screen) ----- */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: #212529; /* 전문적인 다크 테마 배경 */
            color: #f8f9fa;
        }

        /* 상단 상태바 */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            font-size: 1.2rem;
            font-weight: 600;
            pointer-events: none;
        }
        #top-bar > div { pointer-events: auto; }
        
        #lesson-info-display, #progress-display {
            padding: 8px 24px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quit-btn {
            background-color: rgba(250, 82, 82, 0.1);
            color: #fa5252;
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            padding: 8px 20px;
            border: 1px solid rgba(250, 82, 82, 0.3);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .quit-btn:hover {
            background-color: #fa5252;
            color: white;
        }

        /* ----- 공용 컨테이너 ----- */
        .game-container {
            display: none;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 5;
        }

        /* Blur & Mission */
        #mission-text {
            font-size: clamp(2rem, 4vw, 3rem);
            color: #ff8787;
            margin-bottom: 30px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 40px;
            border-radius: 20px;
            display: inline-block;
            border: 2px solid rgba(255, 135, 135, 0.3);
            animation: pulse 2s infinite ease-in-out;
        }

        #blur-word {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 800;
            color: #f8f9fa;
            word-break: keep-all;
            letter-spacing: 2px;
        }
        #blur-ko {
            font-size: clamp(2rem, 5vw, 4rem);
            color: #adb5bd;
            margin-top: 20px;
            font-weight: 600;
        }

        /* 지우개 배틀 (특수하게 둥글고 귀여운 파스텔 젤리 스타일) */
        #eraser-container {
            display: none;
            position: absolute;
            top: 100px;
            left: 5%;
            width: 90%;
            height: calc(100vh - 120px);
            overflow-y: auto;
            flex-wrap: wrap;
            gap: 20px;
            align-content: flex-start;
            justify-content: center;
            padding-bottom: 40px;
            z-index: 5;
        }
        .eraser-card {
            background-color: #ff9ff3;
            color: white;
            font-family: 'Fredoka One', 'Jua', sans-serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            padding: 20px 40px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            user-select: none;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.4);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .eraser-card:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }
        .eraser-card.erased {
            opacity: 0;
            transform: scale(0.1) rotate(45deg);
            pointer-events: none;
        }

        /* Memory */
        #memory-container {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 1000px;
            height: 75vh;
            gap: 15px;
            grid-auto-rows: 1fr;
            perspective: 1000px;
            z-index: 5;
        }
        .memory-card {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .memory-card-inner {
            width: 100%;
            height: 100%;
            position: relative; 
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform: rotateY(0deg); 
        }
        .memory-card.flipped .memory-card-inner {
            transform: rotateY(180deg);
        }
        .memory-card-front, .memory-card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
            word-break: keep-all;
            font-weight: 700;
        }
        .memory-card-front {
            background-color: rgba(255, 255, 255, 0.05);
            color: #adb5bd;
            font-size: clamp(2rem, 5vw, 4rem);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .memory-card-back {
            background-color: #f8f9fa;
            color: #212529;
            font-size: clamp(1.2rem, 3vw, 2rem);
            transform: rotateY(180deg);
            border: 2px solid #339af0;
        }
        .memory-card.matched .memory-card-inner {
            opacity: 1; 
        }
        .memory-card.matched .memory-card-back {
            background-color: #eebefa; 
            color: #5f3dc4; 
            border: 2px solid #cc5de8;
        }

        /* Flashlight */
        #flashlight-overlay {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            width: 800px;
            height: 800px;
            mix-blend-mode: screen; 
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        #word-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(4rem, 8vw, 8rem);
            font-weight: 800;
            z-index: 1;
            text-align: center;
            letter-spacing: 2px;
            width: 100%;
            word-wrap: break-word;
            padding: 0 20px;
            box-sizing: border-box;
            color: #f8f9fa;
        }
        #darkness {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 2; transition: background 0.3s ease;
        }
        .spotlight-on { background: radial-gradient(circle at 50% 50%, transparent 350px, rgba(0,0,0,0.95) 600px) !important; }
        .fully-dark { background: rgba(0,0,0,0.98) !important; }

        /* Scramble */
        #scramble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            display: none;
        }
        
        .scattered-letter {
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(4rem, 8vw, 7rem);
            font-weight: 800;
            color: #69db7c; 
            text-shadow: 0 0 20px rgba(105, 219, 124, 0.4);
            padding: 20px; 
            position: absolute;
            display: inline-block;
            transition: transform 0.2s;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }

        .scattered-letter.dragging {
            cursor: grabbing;
            transform: scale(1.1) !important;
            z-index: 100;
            transition: none;
        }

        /* Unjumble */
        #unjumble-container {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 90%;
            height: 70%;
            z-index: 4;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }
        #unjumble-answer-area {
            display: flex; flex-wrap: wrap; gap: 15px; min-height: 100px; width: 90%;
            justify-content: center; align-items: center; align-content: flex-start;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 30px;
        }
        #unjumble-pool-area {
            display: flex; flex-wrap: wrap; gap: 15px; width: 90%;
            justify-content: center; align-items: center; align-content: flex-start;
        }
        .unjumble-chunk {
            color: white;
            font-family: 'Fredoka One', 'Jua', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            padding: 15px 30px; 
            border-radius: 16px; 
            cursor: pointer;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            user-select: none;
        }
        .unjumble-chunk:hover {
            transform: translateY(-2px);
        }
        .unjumble-chunk:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }

        /* 공통 액션 영역 (버튼 및 결과) */
        #action-container { display: none; position: absolute; text-align: center; z-index: 10; width: 100%; }
        .action-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .action-bottom { top: auto; bottom: 50px; left: 50%; transform: translateX(-50%); }
        .action-translation { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; transform: none !important; }

        .action-translation #action-message { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 1.5rem !important; margin: 0; width: 100%; color: #adb5bd; font-weight: 500; }
        .action-translation #action-korean-hint { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(2.5rem, 5vw, 5rem) !important; margin: 0; width: 100%; display: none; color: #f8f9fa; }
        .action-translation #answer-display { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(2.5rem, 5vw, 5rem) !important; margin: 0; width: 100%; }
        .action-translation #btn-group { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 100%; margin: 0; }

        #action-message {
            font-size: 2rem; color: #fcc419; margin: 0 0 20px 0; font-weight: 800; letter-spacing: 1px;
        }
        .action-bottom #action-message { font-size: 1.5rem; margin-bottom: 15px; color: #adb5bd; font-weight: 500;}
        
        #action-korean-hint {
            font-size: clamp(2rem, 5vw, 4rem); color: #dee2e6; font-weight: 600;
            margin-bottom: 30px; word-break: keep-all; padding: 0 20px; display: none;
        }
        #answer-display {
            display: none; font-size: clamp(3rem, 6vw, 6rem); font-weight: 800; color: #74c0fc;
            margin-bottom: 40px; word-break: keep-all; padding: 0 20px; text-align: center; width: 100%; justify-content: center;
        }

        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }

        /* 컨트롤 버튼들 */
        button.action-btn {
            background-color: rgba(255,255,255,0.1); color: #f8f9fa; font-family: 'Pretendard', sans-serif; font-size: 1.2rem; font-weight: 600;
            padding: 14px 35px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; cursor: pointer; transition: all 0.2s;
            backdrop-filter: blur(5px);
        }
        button.action-btn:hover { background-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        
        button.action-btn.hint-btn { border-color: #fcc419; color: #fcc419; }
        button.action-btn.hint-btn:hover { background-color: rgba(252, 196, 25, 0.1); }
        
        button.action-btn.next-btn { background-color: #339af0; border: none; }
        button.action-btn.next-btn:hover { background-color: #228be6; }
        
        button.action-btn.end-btn { background-color: #fa5252; border: none; }
        
        #btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="custom-alert" class="modal-overlay">
        <div class="modal-box">
            <p id="alert-msg">단어를 입력해주세요!</p>
            <button class="modal-btn" onclick="closeAlert()">확인</button>
        </div>
    </div>

    <div id="custom-confirm" class="modal-overlay">
        <div class="modal-box">
            <p id="confirm-msg">정말로 게임을 종료하고 처음으로 돌아가시겠습니까?</p>
            <button id="confirm-yes" class="modal-btn">네, 나갈게요</button>
            <button id="confirm-no" class="modal-btn cancel">취소</button>
        </div>
    </div>

    <div id="setup-screen">
        <h1>오늘의 교과서 영단어/문장</h1>
        
        <div class="setup-grid">
            <!-- 왼쪽 컬럼 (데이터 입력) -->
            <div>
                <div class="input-group">
                    <label>학습 데이터 종류</label>
                    <div class="mode-selection full-width">
                        <label class="mode-label mode-data">
                            <input type="radio" name="data-type" value="word" checked onchange="handleDataTypeChange()">
                            <span class="mode-title" style="font-size: 1.3rem;">단어 (Words)</span>
                        </label>
                        <label class="mode-label mode-data">
                            <input type="radio" name="data-type" value="sentence" onchange="handleDataTypeChange()">
                            <span class="mode-title" style="font-size: 1.3rem;">문장 (Sentences)</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label>자동 세팅 (교과서 데이터)</label>
                    <div class="flex-mobile-col" style="display: flex; gap: 10px;">

            document.getElementById('custom-alert').style.display = 'none';
        }

        function showConfirm(msg, onYes) {
            document.getElementById('confirm-msg').innerText = msg;
            document.getElementById('custom-confirm').style.display = 'flex';
            
            document.getElementById('confirm-yes').onclick = function() {
                document.getElementById('custom-confirm').style.display = 'none';
                if(onYes) onYes();
            };
            document.getElementById('confirm-no').onclick = function() {
                document.getElementById('custom-confirm').style.display = 'none';
            };
        }

        function shuffleArray(arr) {
            let array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        ];

        let activeDragElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('touchmove', handleDragMove, {passive: false});
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchend', handleDragEnd);

        function handleDragStart(e) {
            if (e.type === 'mousedown' && e.button !== 0) return;
            e.preventDefault();
            
            activeDragElement = this;
            activeDragElement.classList.add('dragging');
            
            if (activeDragElement.style.left.includes('%')) {
                const leftPercent = parseFloat(activeDragElement.style.left);
                const topPercent = parseFloat(activeDragElement.style.top);
                const containerRect = document.getElementById('scramble-container').getBoundingClientRect();
                activeDragElement.style.left = (leftPercent / 100 * containerRect.width) + 'px';
                activeDragElement.style.top = (topPercent / 100 * containerRect.height) + 'px';
            }
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            dragOffsetX = clientX - parseFloat(activeDragElement.style.left);
            dragOffsetY = clientY - parseFloat(activeDragElement.style.top);
        }

        function handleDragMove(e) {
            if (!activeDragElement) return;
            if (e.type === 'touchmove') e.preventDefault(); 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            activeDragElement.style.left = (clientX - dragOffsetX) + 'px';
            activeDragElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragEnd() {
            if (activeDragElement) {
                activeDragElement.classList.remove('dragging');
                activeDragElement = null;
            }
        }

        function updateLessonOptions() {
            const grade = document.getElementById('grade-select').value;
            const lessonSelect = document.getElementById('lesson-select');
            
            lessonSelect.innerHTML = '<option value="">단원 선택</option>';
            if (!grade) return; 

            const maxLesson = (grade === "3" || grade === "4") ? 11 : 12;

            for (let i = 1; i <= maxLesson; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `Lesson ${i}`;
                lessonSelect.appendChild(option);
            }
            
            document.getElementById('word-list').value = '';
            document.getElementById('lesson-info').value = '';
        }

        // 🌟 단어/문장 탭 전환에 따른 게임 제한 효과 🌟
        function handleDataTypeChange() {
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            
            const blurLabel = document.querySelector('input[value="blur"]').closest('.mode-label');
            const eraserLabel = document.querySelector('input[value="eraser"]').closest('.mode-label');
            const missionLabel = document.querySelector('input[value="mission"]').closest('.mode-label');
            const memoryLabel = document.querySelector('input[value="memory"]').closest('.mode-label');
            const flashlightLabel = document.querySelector('input[value="flashlight"]').closest('.mode-label');
            const scrambleLabel = document.querySelector('input[value="scramble"]').closest('.mode-label');
            const unjumbleLabel = document.querySelector('input[value="unjumble"]').closest('.mode-label');

            // 모든 제한 초기화
            const allLabels = [blurLabel, eraserLabel, missionLabel, memoryLabel, flashlightLabel, scrambleLabel, unjumbleLabel];
            allLabels.forEach(label => label.classList.remove('disabled-mode'));

            if (dataType === 'word') {
                unjumbleLabel.classList.add('disabled-mode');
                if (document.querySelector('input[value="unjumble"]').checked) {
                    document.querySelector('input[value="blur"]').checked = true;
                    toggleTimeInput();
                }
            } else if (dataType === 'sentence') {
                scrambleLabel.classList.add('disabled-mode');
                memoryLabel.classList.add('disabled-mode');
                
                if (['scramble', 'memory'].includes(document.querySelector('input[name="game-mode"]:checked').value)) {
                    document.querySelector('input[value="eraser"]').checked = true;
                    toggleTimeInput();
                }
            }
            loadPresetWords();
        }

        function loadPresetWords() {
            const publisher = document.getElementById('publisher-select').value;
            const grade = document.getElementById('grade-select').value;
            const lesson = document.getElementById('lesson-select').value;
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            
            if (!grade || !lesson) return;

            const modeLabel = dataType === 'word' ? '단어' : '문장';
            const pubLabel = publisher === 'ybm' ? 'YBM' : '동아';
            document.getElementById('lesson-info').value = `${pubLabel} ${grade}학년 Lesson ${lesson} (${modeLabel})`;

            let presetWords = [];
            if (publisher === 'ybm') {
                if (dataType === 'word') {
                    presetWords = ybmWordDatabase[grade]?.[lesson] || [];
                } else {
                    presetWords = ybmSentenceDatabase[grade]?.[lesson] || [];
                }
            } else if (publisher === 'donga') {
                if (dataType === 'word') {
                    presetWords = dongaWordDatabase[grade]?.[lesson] || [];
                } else {
                    presetWords = dongaSentenceDatabase[grade]?.[lesson] || [];
                }
            }
            
            if (presetWords.length > 0) {
                document.getElementById('word-list').value = presetWords.join('\n');
            } else {
                document.getElementById('word-list').value = '';
                document.getElementById('word-list').placeholder = `관리자가 아직 이 단원의 ${modeLabel} 데이터를 입력하지 않았습니다.\n직접 입력해주세요!`;
            }
        }

        function startGame() {
            const rawWords = document.getElementById('word-list').value;
            const parsedLines = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
            
            if (parsedLines.length === 0) {
                showAlert("게임을 시작하려면 내용을 최소 1줄 이상 입력해주세요!");
                document.getElementById('word-list').focus();
                return;
            }

            let modeRadios = document.getElementsByName('game-mode');
            for (const radio of modeRadios) {
                if (radio.checked) {
                    currentMode = radio.value;
                    break;
                }
            }
            
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            
            if (dataType === 'sentence' && (currentMode === 'scramble' || currentMode === 'memory')) {
                showAlert("해당 모드는 '단어' 전용 게임입니다!\n[📝 단어 불러오기]를 선택하시거나 다른 게임을 골라주세요.");
                return;
            }
            if (dataType === 'word' && currentMode === 'unjumble') {
                showAlert("🧩 문장 조립 모드는 '문장' 전용 게임입니다!\n[💬 문장 불러오기]를 선택하시거나 다른 게임을 골라주세요.");
                return;
            }
            
            const hintRadios = document.getElementsByName('hint-mode');
            for (const radio of hintRadios) {
                if (radio.checked) {
                    isHintModeOn = (radio.value === 'on');
                    break;
                }
            }

            words = [];
            parsedLines.forEach(line => {
                let en = line;
                let ko = "";

                if (line.includes('|')) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 2) {
                        en = parts[0];
                        ko = parts[1];
                    }
                } else if (line.includes(',')) {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 2) {
                        en = parts[0];
                        ko = parts[1];
                    }
                }

                if (currentMode === 'unjumble' && ko) {
                    words.push({ type: 'jumble', en: en, ko: ko });      
                    words.push({ type: 'translation', en: en, ko: ko }); 
                } else {
                    words.push({ type: 'standard', en: en, ko: ko });
                }
            });

            words = shuffleArray(words);

            const timeInSeconds = parseInt(document.getElementById('time').value);
            timeInMilliseconds = (timeInSeconds > 0 ? timeInSeconds : 3) * 1000;

            const lessonInfo = document.getElementById('lesson-info').value.trim();
            document.getElementById('lesson-info-display').innerText = lessonInfo;
            document.getElementById('lesson-info-display').style.display = lessonInfo ? 'block' : 'none';

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            currentWordIndex = 0;
            playCurrentWord();
        }

        // 🌟 부분 블러 해제 처리 🌟
        function reduceBlur() {
            if (currentBlur > 0) {
                currentBlur -= 10;
                if (currentBlur < 0) currentBlur = 0;
            } else {
                hiddenBlur -= 10;
                if (hiddenBlur < 0) hiddenBlur = 0;
            }
            
            const spans = document.getElementById('blur-word').querySelectorAll('span');
            if (spans.length > 0) {
                spans.forEach((span, i) => {
                    // 숨겨진 인덱스가 아니면 먼저 선명하게, 나중엔 숨겨진 인덱스도 선명하게 처리
                    if (!hiddenIndices.includes(i)) {
                        span.style.filter = `blur(${currentBlur}px)`;
                    } else {
                        span.style.filter = `blur(${hiddenBlur}px)`;
                    }
                });
            } else {
                document.getElementById('blur-word').style.filter = `blur(${currentBlur}px)`;
            }

            // 모든 글자가 완전히 보이면 힌트 버튼 숨기기
            if (currentBlur === 0 && hiddenBlur === 0) {
                document.getElementById('hint-btn').style.display = 'none';
            }
        }

        function createUnjumbleChunk(text, index) {
            const pastelColors = ['#ff9ff3', '#feca57', '#48dbfb', '#1dd1a1', '#ff6b6b', '#a29bfe'];
            const btn = document.createElement('div');
            btn.className = 'unjumble-chunk';
            btn.innerText = text;
            btn.style.backgroundColor = pastelColors[index % pastelColors.length];
            
            btn.onclick = function() {
                if (btn.parentElement.id === 'unjumble-pool-area') {
                    document.getElementById('unjumble-answer-area').appendChild(btn);
                } else {
                    document.getElementById('unjumble-pool-area').appendChild(btn);
                }
            };
            return btn;
        }

        function playCurrentWord() {
            // 모든 이전 타이머 초기화 (강력한 안전장치)
            if (timerId !== null) {
                clearTimeout(timerId);
                timerId = null;
            }

            const currentItem = words[currentWordIndex];
            const originalWord = currentItem ? currentItem.en : "";
            const koreanHintText = currentItem ? currentItem.ko : "";

            const actionContainer = document.getElementById('action-container');
            const actionBtn = document.getElementById('main-action-btn');
            actionContainer.style.display = 'none';
            document.getElementById('answer-display').style.display = 'none';
            document.getElementById('word-display').style.display = 'none';
            
            // 🌟 컨테이너 초기화 🌟
            const scrambleContainer = document.getElementById('scramble-container');
            scrambleContainer.style.display = 'none';
            scrambleContainer.innerHTML = ''; 

            const unjumbleContainer = document.getElementById('unjumble-container');
            unjumbleContainer.style.display = 'none';
            document.getElementById('unjumble-answer-area').innerHTML = '';
            document.getElementById('unjumble-pool-area').innerHTML = '';

            document.getElementById('blur-container').style.display = 'none';
            
            // 🌟 지우개 배틀 컨테이너 초기화 (버그 수정됨) 🌟
            const eraserContainer = document.getElementById('eraser-container');
            eraserContainer.style.display = 'none';
            eraserContainer.innerHTML = '';
            
            const memoryContainer = document.getElementById('memory-container');
            memoryContainer.style.display = 'none';
            memoryContainer.innerHTML = '';

            document.getElementById('flashlight-overlay').style.opacity = '0';
            const darkness = document.getElementById('darkness');
            darkness.className = '';
            darkness.style.opacity = '0'; 
            
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('hint-btn').style.display = 'none';

            updateProgress();
            
            // ===============================================
            // 🃏 Memory 모드
            // ===============================================
            if (currentMode === 'memory') {
                currentState = 'playing';
                document.getElementById('progress-display').style.display = 'none';
                
                // 🌟 카드를 즉시 보여주지 않음 (안내 메시지 후 표시하기 위함)
                // memoryContainer.style.display = 'grid'; 

                let pairCount = Math.min(words.length, 10); 
                let totalCards = pairCount * 2;
                
                let cols = window.innerWidth <= 600 ? 4 : (totalCards <= 16 ? 4 : 5);
                memoryContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

                let deck = [];
                for(let i = 0; i < pairCount; i++) {
                    deck.push({ text: words[i].en, id: i });
                    deck.push({ text: words[i].ko, id: i });
                }
                deck = shuffleArray(deck);

                deck.forEach((cardData, i) => {
                    const card = document.createElement('div');
                    card.className = 'memory-card flipped'; 
                    card.dataset.id = cardData.id;

                    const inner = document.createElement('div');
                    inner.className = 'memory-card-inner';

                    const front = document.createElement('div');
                    front.className = 'memory-card-front';
                    front.innerText = '?';

                    const back = document.createElement('div');
                    back.className = 'memory-card-back';
                    back.innerText = cardData.text;

                    inner.appendChild(front);
                    inner.appendChild(back);
                    card.appendChild(inner);
                    memoryContainer.appendChild(card);

                    card.addEventListener('click', flipCard);
                });

                // 1. 시작 전 안내 메시지 (화면 중앙, 아주 어두운 배경 + 글자 박스)
                darkness.className = 'fully-dark';
                darkness.style.opacity = '0.9'; // 배경을 훨씬 더 어둡게

                actionContainer.className = 'action-center';
                const actionMsg = document.getElementById('action-message');
                actionMsg.innerText = "5초간 카드의 짝을 기억하세요! 👀";
                actionMsg.style.fontSize = "clamp(2.5rem, 5vw, 4rem)";
                
                // 🌟 글자에만 집중할 수 있도록 반투명 검은 박스 깔기
                actionMsg.style.background = 'rgba(0, 0, 0, 0.7)';
                actionMsg.style.padding = '30px 50px';
                actionMsg.style.borderRadius = '20px';
                actionMsg.style.backdropFilter = 'blur(10px)';
                actionMsg.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
                actionMsg.style.display = 'inline-block';

                document.getElementById('action-korean-hint').style.display = 'none';
                document.getElementById('btn-group').style.display = 'none';
                actionContainer.style.display = 'block';

                let hasFlippedCard = false;
                let lockBoard = true; 
                let firstCard, secondCard;
                let matchedCount = 0;

                // 2. 2초 후 안내창/배경 숨기고 카드 표시 & 5초 기억 시간 시작
                timerId = setTimeout(() => {
                    actionContainer.style.display = 'none';
                    darkness.style.opacity = '0';
                    
                    // 다른 게임에 영향이 가지 않도록 스타일 원상복구
                    actionMsg.style.fontSize = ""; 
                    actionMsg.style.background = "";
                    actionMsg.style.padding = "";
                    actionMsg.style.borderRadius = "";
                    actionMsg.style.backdropFilter = "";
                    actionMsg.style.boxShadow = "";
                    actionMsg.style.display = "";

                    // 🌟 이제 화면에 카드를 짠! 하고 보여줌
                    memoryContainer.style.display = 'grid';

                    // 3. 5초 기억 시간 후 촤라락 애니메이션 진행
                    timerId = setTimeout(() => {
                        const cards = document.querySelectorAll('.memory-card');
                        
                        actionContainer.className = 'action-bottom';
                        actionMsg.innerText = "짝을 맞춰보세요! 🃏";
                        actionContainer.style.display = 'block';

                        // 촤라락 뒤집기
                        cards.forEach((card, i) => {
                            setTimeout(() => { card.classList.remove('flipped'); }, i * 50); 
                        });
                        
                        // 게임 시작 (클릭 잠금 해제)
                        setTimeout(() => {
                            lockBoard = false;
                            setTimeout(() => { actionContainer.style.display = 'none'; }, 2000);
                        }, cards.length * 50 + 500);

                    }, 5000);
                }, 2000);

                function flipCard() {
                    if (lockBoard) return;
                    if (this === firstCard) return;
                    if (this.classList.contains('matched')) return;

                    this.classList.add('flipped');

                    if (!hasFlippedCard) {
                        hasFlippedCard = true;
                        firstCard = this;
                        return;
                    }

                    secondCard = this;
                    checkForMatch();
                }

                function checkForMatch() {
                    let isMatch = firstCard.dataset.id === secondCard.dataset.id;
                    isMatch ? disableCards() : unflipCards();
                }

                function disableCards() {
                    firstCard.classList.add('matched');
                    secondCard.classList.add('matched');
                    matchedCount++;
                    resetBoard();

                    if (matchedCount === pairCount) {
                        setTimeout(() => {
                            currentState = 'memory-won';
                            document.getElementById('action-message').innerText = "🎉 미션 클리어! 🎉";
                            document.getElementById('action-message').style.display = 'block';
                            actionBtn.innerText = "처음으로 돌아가기";
                            actionBtn.className = 'action-btn end-btn';
                            document.getElementById('btn-group').style.display = 'flex';
                            actionContainer.className = 'action-center';
                            actionContainer.style.display = 'block';
                        }, 1000);
                    }
                }

                function unflipCards() {
                    lockBoard = true;
                    setTimeout(() => {
                        firstCard.classList.remove('flipped');
                        secondCard.classList.remove('flipped');
                        resetBoard();
                    }, 1000);
                }

                function resetBoard() {
                    [hasFlippedCard, lockBoard] = [false, false];
                    [firstCard, secondCard] = [null, null];
                }
            }
            // ===============================================
            // ✨ Blur 모드
            // ===============================================
            else if (currentMode === 'blur') {
                currentState = 'writing'; 
                currentBlur = 35; 
                hiddenBlur = 35; 

                document.getElementById('blur-container').style.display = 'block';
                document.getElementById('mission-text').style.display = 'none';
                
                const blurWord = document.getElementById('blur-word');
                blurWord.innerHTML = ''; 
                blurWord.style.color = '#339af0'; 

                // 🌟 부분 블러 처리 로직
                const chars = originalWord.split('');
                let validIndices = [];
                chars.forEach((c, i) => { if (c.trim() !== '') validIndices.push(i); });
                
                let hideCount = 1;
                if (validIndices.length >= 5) hideCount = 2; 
                if (validIndices.length >= 7) hideCount = 3; 
                
                hiddenIndices = shuffleArray(validIndices).slice(0, hideCount);

                chars.forEach((char, i) => {
                    const span = document.createElement('span');
                    span.innerText = char;
                    if (char === ' ') span.style.marginRight = '15px'; 
                    span.style.filter = `blur(${currentBlur}px)`;
                    span.style.transition = 'filter 0.5s ease';
                    blurWord.appendChild(span);
                });

                if(isHintModeOn && koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                } else {
                    document.getElementById('blur-ko').style.display = 'none';
                }

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').style.display = 'none';
                document.getElementById('action-korean-hint').style.display = 'none';
                document.getElementById('btn-group').style.display = 'flex';

                document.getElementById('hint-btn').style.display = 'inline-block';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                
                actionContainer.style.display = 'block';
            }
            // ===============================================
            // ✨ Eraser 모드
            // ===============================================
            else if (currentMode === 'eraser') {
                currentState = 'playing'; 
                document.getElementById('progress-display').style.display = 'none'; 
                
                eraserContainer.style.display = 'flex';
                
                let cardItems = [];
                words.forEach(w => {
                    if(w.en) cardItems.push(w.en);
                    if(w.ko) cardItems.push(w.ko);
                });
                cardItems = shuffleArray(cardItems); 
                
                const pastelColors = ['#ff9ff3', '#feca57', '#48dbfb', '#1dd1a1', '#ff6b6b', '#a29bfe'];
                
                cardItems.forEach((text, i) => {
                    const card = document.createElement('div');
                    card.className = 'eraser-card';
                    card.innerText = text;
                    card.style.backgroundColor = pastelColors[i % pastelColors.length];
                    
                    card.onclick = function() {
                        card.classList.add('erased');
                    };
                    eraserContainer.appendChild(card);
                });
            }
            // ===============================================
            // ✨ Mission 모드
            // ===============================================
            else if (currentMode === 'mission') {
                currentState = 'writing'; 
                
                document.getElementById('blur-container').style.display = 'block';
                
                const missionText = document.getElementById('mission-text');
                missionText.innerText = missions[Math.floor(Math.random() * missions.length)];

                if(isHintModeOn && koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                } else {
                    document.getElementById('blur-ko').style.display = 'none';
                }

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').style.display = 'none';
                document.getElementById('action-korean-hint').style.display = 'none';
                document.getElementById('btn-group').style.display = 'flex';

                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                
                actionContainer.style.display = 'block';
            }
            // ===============================================
            // 🧩 Unjumble 모드
            // ===============================================
            else if (currentMode === 'unjumble') {
                currentState = 'writing'; 
                const unjumbleContainer = document.getElementById('unjumble-container');
                unjumbleContainer.style.display = 'flex';
                
                darkness.className = 'fully-dark';
                darkness.style.opacity = '0.6'; 

                const poolArea = document.getElementById('unjumble-pool-area');
                
                const actionMessage = document.getElementById('action-message');
                const actionKoreanHint = document.getElementById('action-korean-hint');

                if (currentItem.type === 'jumble' || currentItem.type === 'standard') {
                    unjumbleContainer.style.display = 'flex';
                    actionMessage.innerText = "단어를 클릭해 문장을 완성하세요 🧩";
                    actionContainer.className = 'action-bottom'; 
                    document.getElementById('btn-group').style.display = 'flex';

                    if(isHintModeOn && koreanHintText) {
                        actionKoreanHint.innerText = `"${koreanHintText}"`;
                        actionKoreanHint.style.display = 'block';
                    } else {
                        actionKoreanHint.style.display = 'none';
                    }

                    const chunks = originalWord.split(' ').filter(c => c.trim().length > 0);
                    let shuffledChunks = shuffleArray(chunks);
                    if(chunks.length > 1) {
                        let attempts = 0;
                        while (shuffledChunks.join(' ') === chunks.join(' ') && attempts < 10) {
                            shuffledChunks = shuffleArray(chunks);
                            attempts++;
                        }
                    }
                    shuffledChunks.forEach((text, i) => {
                        poolArea.appendChild(createUnjumbleChunk(text, i));
                    });
                } 
                else if (currentItem.type === 'translation') {
                    unjumbleContainer.style.display = 'none'; 
                    actionMessage.innerText = "다음 뜻에 맞는 영어 문장을 말해보세요 🗣️";
                    actionKoreanHint.innerText = `"${koreanHintText}"`;
                    actionKoreanHint.style.display = 'block'; 
                    actionContainer.className = 'action-translation'; 
                    document.getElementById('btn-group').style.display = 'flex';
                }
                
                actionBtn.innerText = "정답 확인";
                actionBtn.className = 'action-btn';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            } 
            // ===============================================
            // 🔀 Scramble 모드
            // ===============================================
            else if (currentMode === 'scramble') {
                currentState = 'writing'; 
                scrambleContainer.style.display = 'block';
                
                darkness.className = 'fully-dark';
                darkness.style.opacity = '0.6'; 

                const placedPositions = [];
                const minDistance = 14; 
                const chars = originalWord.split('');
                chars.forEach(char => {
                    if(char.trim() === '') return; 
                    const span = document.createElement('span');
                    span.innerText = char;
                    span.className = 'scattered-letter';

                    let top, left;
                    let attempts = 0;
                    let validPosition = false;

                    while (!validPosition && attempts < 50) {
                        top = 20 + Math.random() * 40; 
                        left = 10 + Math.random() * 70;  
                        validPosition = true;
                        for (let pos of placedPositions) {
                            const dx = pos.left - left;
                            const dy = pos.top - top; 
                            if (Math.sqrt(dx*dx + dy*dy) < minDistance) {
                                validPosition = false; 
                                break;
                            }
                        }
                        attempts++;
                    }

                    placedPositions.push({top, left});
                    span.style.top = `${top}%`;
                    span.style.left = `${left}%`;
                    span.style.transform = `rotate(${-15 + Math.random() * 30}deg)`;

                    span.addEventListener('mousedown', handleDragStart);
                    span.addEventListener('touchstart', handleDragStart, {passive: false});

                    scrambleContainer.appendChild(span);
                });

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').innerText = "Guess the Word! 🤔";
                document.getElementById('action-message').style.display = 'block';
                document.getElementById('btn-group').style.display = 'flex';
                
                if(isHintModeOn && koreanHintText) {
                    document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                    document.getElementById('action-korean-hint').style.display = 'block';
                } else {
                    document.getElementById('action-korean-hint').style.display = 'none'; 
                }
                
                actionBtn.innerText = "정답 확인";
                actionBtn.className = 'action-btn';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            } 
            // ===============================================
            // 🔦 Flashlight 모드
            // ===============================================
            else if (currentMode === 'flashlight') {
                currentState = 'showing';
                
                const wordDisplay = document.getElementById('word-display');
                wordDisplay.innerText = originalWord;
                wordDisplay.style.display = 'block';
                
                darkness.className = '';
                darkness.style.opacity = '1';
                
                setTimeout(() => {
                    if(currentState === 'showing') {
                        darkness.classList.add('spotlight-on');
                        document.getElementById('flashlight-overlay').style.opacity = '1'; 
                    }
                }, 500);

                timerId = setTimeout(() => {
                    showWritePrompt();
                }, timeInMilliseconds + 500);
            }
        }

        function showWritePrompt() {
            currentState = 'writing';
            const currentItem = words[currentWordIndex];
            const koreanHintText = currentItem ? currentItem.ko : "";

            const darkness = document.getElementById('darkness');
            darkness.className = 'fully-dark';
            darkness.style.opacity = '1';
            document.getElementById('flashlight-overlay').style.opacity = '0'; 
            document.getElementById('word-display').style.display = 'none';

            const actionContainer = document.getElementById('action-container');
            actionContainer.className = 'action-center';
            document.getElementById('action-message').innerText = "Time to Write! ✍️";
            document.getElementById('action-message').style.display = 'block';
            document.getElementById('btn-group').style.display = 'flex';
            
            if(isHintModeOn && koreanHintText) {
                document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                document.getElementById('action-korean-hint').style.display = 'block';
            } else {
                document.getElementById('action-korean-hint').style.display = 'none'; 
            }
            
            const actionBtn = document.getElementById('main-action-btn');
            actionBtn.innerText = "정답 확인";
            actionBtn.className = 'action-btn';
            
            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
            document.getElementById('retry-btn').style.display = 'inline-block';
            
            setTimeout(() => { actionContainer.style.display = 'block'; }, 500);
        }

        function handleActionClick() {
            if (currentState === 'writing') {
                showAnswer();
            } else if (currentState === 'answered') {
                nextWord();
            } else if (currentState === 'memory-won') {
                resetGame();
            }
        }

        function showAnswer() {
            currentState = 'answered';
            const currentItem = words[currentWordIndex];
            const koreanHintText = currentItem ? currentItem.ko : "";
            const actionContainer = document.getElementById('action-container');
            const actionBtn = document.getElementById('main-action-btn');
            
            const scrambleContainer = document.getElementById('scramble-container');
            scrambleContainer.style.display = 'none';
            scrambleContainer.innerHTML = ''; 

            document.getElementById('unjumble-container').style.display = 'none';

            if (['blur', 'mission'].includes(currentMode)) {
                const spans = document.getElementById('blur-word').querySelectorAll('span');
                if(spans.length > 0) {
                    spans.forEach(span => span.style.filter = 'blur(0px)');
                } else {
                    document.getElementById('blur-word').style.filter = 'blur(0px)';
                }
                document.getElementById('hint-btn').style.display = 'none';

                document.getElementById('blur-word').innerText = currentItem.en;
                document.getElementById('blur-word').style.display = 'block';
                document.getElementById('blur-word').style.color = '#339af0'; 
                
                if(koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                }
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                return; 
            }

            if (currentMode === 'unjumble' && currentItem.type === 'translation') {
                actionContainer.className = 'action-translation';
            } else {
                actionContainer.className = 'action-center';
            }

            document.getElementById('action-message').style.display = 'none';
            
            if(koreanHintText) {
                document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                document.getElementById('action-korean-hint').style.display = 'block';
            } else {
                document.getElementById('action-korean-hint').style.display = 'none'; 
            }
            
            document.getElementById('hint-btn').style.display = 'none';
            
            const answerDisplay = document.getElementById('answer-display');
            answerDisplay.innerText = currentItem.en; 
            answerDisplay.style.display = 'flex';

            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
            document.getElementById('retry-btn').style.display = 'inline-block';

            if (currentWordIndex < words.length - 1) {
                actionBtn.innerText = "다음 문제 ➔";
                actionBtn.className = 'action-btn next-btn';
            } else {
                actionBtn.innerText = "🎉 게임 종료";
                actionBtn.className = 'action-btn end-btn';
            }
        }

        function nextWord() {
            if (timerId !== null) {
                clearTimeout(timerId);
                timerId = null;
            }

            if (currentWordIndex < words.length - 1) {
                currentWordIndex++;
                playCurrentWord();
            } else {
                resetGame();
            }
        }

        function prevWord() {
            if (timerId !== null) {
                clearTimeout(timerId);
                timerId = null;
            }

            if (currentWordIndex > 0) {
                currentWordIndex--;
                playCurrentWord();
            }
        }

        function retryProblem() {
            if (timerId !== null) {
                clearTimeout(timerId);
                timerId = null;
            }
            playCurrentWord();
        }

        function updateProgress() {
            document.getElementById('progress-display').innerText = `Word ${currentWordIndex + 1} / ${words.length}`;
        }

        function resetGame() {
            if (timerId !== null) {
                clearTimeout(timerId);
                timerId = null;
            }

            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('progress-display').style.display = 'block'; 
            
            const scrambleContainer = document.getElementById('scramble-container');
            scrambleContainer.innerHTML = ''; 
            scrambleContainer.style.display = 'none';
            
            document.getElementById('unjumble-container').style.display = 'none';
            document.getElementById('blur-container').style.display = 'none';
            
            // 🌟 종료 시에도 지우개 컨테이너 초기화
            document.getElementById('eraser-container').style.display = 'none';
            document.getElementById('eraser-container').innerHTML = '';
            
            document.getElementById('memory-container').style.display = 'none';
            document.getElementById('memory-container').innerHTML = '';
            document.getElementById('flashlight-overlay').style.opacity = '0';
        }

        function quitGame() {
            showConfirm("정말로 게임을 종료하고 처음으로 돌아가시겠습니까?", function() {
                resetGame();
            });
        }
    </script>
</body>
</html>
