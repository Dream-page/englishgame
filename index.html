<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 교과서 영단어/문장</title>
    <meta property="og:title" content="오늘의 교과서 영단어/문장">
    <meta property="og:description" content="교과서 영단어와 문장을 재미있는 게임으로 학습해보세요!">
    <meta property="og:type" content="website">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #f8f9fa;
            font-family: 'Pretendard', sans-serif;
            overflow: hidden; display: flex;
            justify-content: center; align-items: center;
            height: 100vh; color: #212529; 
        }

        /* Modal Styles */
        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); z-index: 1000;
            justify-content: center; align-items: center;
            backdrop-filter: blur(4px); 
        }
        .modal-box {
            background: #ffffff; padding: 40px 50px;
            border-radius: 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px; width: 90%;
            border: 1px solid #e9ecef; box-sizing: border-box;
        }
        .modal-box p { font-size: 1.2rem; margin-bottom: 20px; color: #343a40; font-weight: 600; white-space: pre-wrap; line-height: 1.5; }
        .modal-btn { background: #4dabf7; color: white; border: none; padding: 12px 30px; font-size: 1rem; border-radius: 10px; cursor: pointer; font-weight: 600; margin: 0 8px; transition: all 0.2s; box-shadow: 0 4px 6px rgba(77, 171, 247, 0.2); }
        .modal-btn:hover { transform: translateY(-2px); background: #3bc9db; box-shadow: 0 6px 12px rgba(77, 171, 247, 0.3); }
        .modal-btn.cancel { background: #f1f3f5; color: #495057; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .modal-btn.cancel:hover { background: #e9ecef; box-shadow: 0 6px 12px rgba(0,0,0,0.08); }
        .modal-input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ced4da; font-size: 1rem; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        .modal-input:focus { outline: none; border-color: #339af0; box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.1); }

        /* Setup Screen */
        #setup-screen { background-color: #ffffff; padding: 40px 50px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); z-index: 10; width: 90%; max-width: 1100px; max-height: 90vh; overflow-y: auto; border: 1px solid #dee2e6; box-sizing: border-box; display: flex; flex-direction: column; }
        #setup-screen h1 { color: #212529; margin-top: 0; margin-bottom: 30px; font-size: 2.2rem; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
        .setup-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; text-align: left; }
        .input-group { margin-bottom: 24px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 1rem; font-weight: 700; color: #495057; }
        .input-group input[type="text"], .input-group input[type="number"], .input-group textarea, .input-group select { width: 100%; padding: 14px 16px; font-size: 1rem; border: 1px solid #ced4da; border-radius: 12px; box-sizing: border-box; background-color: #f8f9fa; color: #212529; font-family: 'Pretendard', sans-serif; transition: all 0.3s ease; }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus { outline: none; border-color: #339af0; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(51, 154, 240, 0.1); }
        .input-group select { cursor: pointer; }
        .input-group textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
        .info-text { font-size: 0.85rem; color: #868e96; margin-bottom: 8px; line-height: 1.4; }
        .mode-selection { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .mode-selection.full-width { grid-template-columns: 1fr; }
        .mode-label { background: #ffffff; padding: 16px; border-radius: 12px; cursor: pointer; text-align: left; border: 1px solid #ced4da; transition: all 0.2s ease; color: #495057; display: flex; flex-direction: column; justify-content: center; }
        .mode-label input[type="radio"] { display: none; }
        .mode-label:hover { transform: translateY(2px); box-shadow: 0 2px 0 #dfe6e9; }
        .mode-label.disabled-mode { opacity: 0.4; pointer-events: none; background-color: #f1f3f5; border-color: #dee2e6; filter: grayscale(100%); }
        .mode-label:has(input[type="radio"]:checked) { border-color: #339af0; background-color: #e7f5ff; box-shadow: 0 0 0 2px rgba(51, 154, 240, 0.2); color: #1864ab; }
        .mode-label:has(input[type="radio"]:checked) .mode-title { color: #1864ab; }
        .mode-title { display: block; font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; color: #343a40; transition: color 0.2s ease; }
        .mode-desc { font-size: 0.85rem; color: #868e96; }
        button.start-btn { background-color: #339af0; color: #ffffff; font-family: 'Pretendard', sans-serif; font-size: 1.3rem; font-weight: 700; padding: 18px 40px; border: none; border-radius: 16px; cursor: pointer; transition: all 0.3s ease; margin-top: 30px; width: 100%; max-width: 400px; box-shadow: 0 8px 16px rgba(51, 154, 240, 0.2); align-self: center; }
        button.start-btn:hover { transform: translateY(-2px); background-color: #228be6; box-shadow: 0 10px 20px rgba(51, 154, 240, 0.3); }
        @media (max-width: 850px) { .setup-grid { grid-template-columns: 1fr; gap: 0; } #setup-screen { padding: 30px 20px; max-height: 85vh; width: 95%;} #setup-screen h1 { font-size: 1.8rem; margin-bottom: 20px; } .mode-selection { grid-template-columns: 1fr; } .flex-mobile-col { flex-direction: column !important; } button.start-btn { max-width: 100%; } }

        /* Game Screen */
        #game-screen { display: none; width: 100vw; height: 100vh; position: relative; background-color: #212529; color: #f8f9fa; }
        #top-bar { position: absolute; top: 20px; left: 0; width: 100%; padding: 0 40px; box-sizing: border-box; display: flex; justify-content: space-between; z-index: 100; font-size: 1.2rem; font-weight: 600; pointer-events: none; }
        #top-bar > div { pointer-events: auto; }
        #lesson-info-display, #progress-display { padding: 8px 24px; border-radius: 50px; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .quit-btn { background-color: rgba(250, 82, 82, 0.1); color: #fa5252; font-family: 'Pretendard', sans-serif; font-weight: 600; font-size: 1rem; padding: 8px 20px; border: 1px solid rgba(250, 82, 82, 0.3); border-radius: 50px; cursor: pointer; transition: all 0.2s; }
        .quit-btn:hover { background-color: #fa5252; color: white; }
        .game-container { display: none; position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); width: 90%; text-align: center; z-index: 5; }

        /* Modes */
        #mission-text { font-size: clamp(2rem, 4vw, 3rem); color: #ff8787; margin-bottom: 30px; font-weight: 800; background: rgba(255, 255, 255, 0.05); padding: 15px 40px; border-radius: 20px; display: inline-block; border: 2px solid rgba(255, 135, 135, 0.3); animation: pulse 2s infinite ease-in-out; }
        #blur-word { font-size: clamp(4rem, 10vw, 8rem); font-weight: 800; color: #f8f9fa; word-break: keep-all; letter-spacing: 2px; }
        #blur-ko { font-size: clamp(2rem, 5vw, 4rem); color: #adb5bd; margin-top: 20px; font-weight: 600; }
        #eraser-container { display: none; position: absolute; top: 100px; left: 5%; width: 90%; height: calc(100vh - 120px); overflow-y: auto; flex-wrap: wrap; gap: 20px; align-content: flex-start; justify-content: center; padding-bottom: 40px; z-index: 5; }
        .eraser-card { background-color: #ff9ff3; color: white; font-family: 'Fredoka One', 'Jua', sans-serif; font-size: clamp(2.5rem, 5vw, 4.5rem); padding: 20px 40px; border-radius: 20px; cursor: pointer; box-shadow: 0 8px 0 rgba(0,0,0,0.15); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); user-select: none; text-align: center; border: 3px solid rgba(255,255,255,0.4); text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .eraser-card:active { transform: translateY(8px); box-shadow: 0 0 0 rgba(0,0,0,0.1); }
        .eraser-card.erased { opacity: 0; transform: scale(0.1) rotate(45deg); pointer-events: none; }
        #memory-container { display: none; position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 1600px; height: 85vh; gap: 20px; grid-auto-rows: 1fr; perspective: 1000px; z-index: 5; }
        .memory-card { position: relative; width: 100%; height: 100%; cursor: pointer; }
        .memory-card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); transform: rotateY(0deg); }
        .memory-card.flipped .memory-card-inner { transform: rotateY(180deg); }
        .memory-card-front, .memory-card-back { width: 100%; height: 100%; position: absolute; top: 0; left: 0; backface-visibility: hidden; display: flex; justify-content: center; align-items: center; border-radius: 16px; text-align: center; box-sizing: border-box; padding: 15px; word-break: keep-all; font-weight: 700; line-height: 1.2; }
        .memory-card-front { background-color: rgba(255, 255, 255, 0.05); color: #adb5bd; font-size: clamp(3rem, 6vw, 5rem); border: 1px solid rgba(255,255,255,0.1); }
        .memory-card-back { background-color: #f8f9fa; color: #212529; font-size: clamp(2rem, 4.5vw, 3.5rem); transform: rotateY(180deg); border: 2px solid #339af0; }
        .memory-card.matched .memory-card-inner { opacity: 1; }
        .memory-card.matched .memory-card-back { background-color: #eebefa; color: #5f3dc4; border: 2px solid #cc5de8; }
        #flashlight-overlay { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%) rotate(-10deg); width: 800px; height: 800px; mix-blend-mode: screen; opacity: 0; z-index: 3; pointer-events: none; transition: opacity 0.3s ease; }
        #word-display { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(4rem, 8vw, 8rem); font-weight: 800; z-index: 1; text-align: center; letter-spacing: 2px; width: 100%; word-wrap: break-word; padding: 0 20px; box-sizing: border-box; color: #f8f9fa; }
        #darkness { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2; transition: background 0.3s ease; }
        .spotlight-on { background: radial-gradient(circle at 50% 50%, transparent 350px, rgba(0,0,0,0.95) 600px) !important; }
        .fully-dark { background: rgba(0,0,0,0.98) !important; }
        #scramble-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 4; display: none; }
        .scattered-letter { font-family: 'Fredoka One', 'Jua', cursive; font-size: clamp(4rem, 8vw, 7rem); font-weight: 800; color: #69db7c; text-shadow: 0 0 20px rgba(105, 219, 124, 0.4); padding: 20px; position: absolute; display: inline-block; transition: transform 0.2s; cursor: grab; user-select: none; touch-action: none; }
        .scattered-letter.dragging { cursor: grabbing; transform: scale(1.1) !important; z-index: 100; transition: none; }
        #unjumble-container { position: absolute; top: 15%; left: 5%; width: 90%; height: 70%; z-index: 4; display: none; flex-direction: column; align-items: center; gap: 40px; }
        #unjumble-answer-area { display: flex; flex-wrap: wrap; gap: 15px; min-height: 100px; width: 90%; justify-content: center; align-items: center; align-content: flex-start; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 30px; }
        #unjumble-pool-area { display: flex; flex-wrap: wrap; gap: 15px; width: 90%; justify-content: center; align-items: center; align-content: flex-start; }
        .unjumble-chunk { color: white; font-family: 'Fredoka One', 'Jua', sans-serif; font-size: clamp(1.5rem, 3vw, 2.5rem); padding: 15px 30px; border-radius: 16px; cursor: pointer; border: 3px solid rgba(255, 255, 255, 0.4); box-shadow: 0 6px 0 rgba(0,0,0,0.15); text-shadow: 1px 1px 3px rgba(0,0,0,0.2); transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55); user-select: none; }
        .unjumble-chunk:hover { transform: translateY(-2px); }
        .unjumble-chunk:active { transform: translateY(6px); box-shadow: 0 0 0 rgba(0,0,0,0.1); }

        /* Action Areas */
        #action-container { display: none; position: absolute; text-align: center; z-index: 10; width: 100%; }
        .action-center { top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .action-bottom { top: auto; bottom: 50px; left: 50%; transform: translateX(-50%); }
        .action-translation { top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; transform: none !important; }
        .action-translation #action-message { position: absolute; top: 15%; left: 50%; transform: translateX(-50%); font-size: 1.5rem !important; margin: 0; width: 100%; color: #adb5bd; font-weight: 500; }
        .action-translation #action-korean-hint { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(2.5rem, 5vw, 5rem) !important; margin: 0; width: 100%; display: none; color: #f8f9fa; }
        .action-translation #answer-display { position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(2.5rem, 5vw, 5rem) !important; margin: 0; width: 100%; }
        .action-translation #btn-group { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 100%; margin: 0; }
        #action-message { font-size: 2rem; color: #fcc419; margin: 0 0 20px 0; font-weight: 800; letter-spacing: 1px; }
        .action-bottom #action-message { font-size: 1.5rem; margin-bottom: 15px; color: #adb5bd; font-weight: 500;}
        #action-korean-hint { font-size: clamp(2rem, 5vw, 4rem); color: #dee2e6; font-weight: 600; margin-bottom: 30px; word-break: keep-all; padding: 0 20px; display: none; }
        #answer-display { display: none; font-size: clamp(3rem, 6vw, 6rem); font-weight: 800; color: #74c0fc; margin-bottom: 40px; word-break: keep-all; padding: 0 20px; text-align: center; width: 100%; justify-content: center; }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.8; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1); } }
        button.action-btn { background-color: rgba(255,255,255,0.1); color: #f8f9fa; font-family: 'Pretendard', sans-serif; font-size: 1.2rem; font-weight: 600; padding: 14px 35px; border: 1px solid rgba(255,255,255,0.2); border-radius: 50px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(5px); }
        button.action-btn:hover { background-color: rgba(255,255,255,0.2); transform: translateY(-2px); }
        button.action-btn.hint-btn { border-color: #fcc419; color: #fcc419; }
        button.action-btn.hint-btn:hover { background-color: rgba(252, 196, 25, 0.1); }
        button.action-btn.next-btn { background-color: #339af0; border: none; }
        button.action-btn.next-btn:hover { background-color: #228be6; }
        button.action-btn.end-btn { background-color: #fa5252; border: none; }
        #btn-group { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div id="custom-alert" class="modal-overlay">
        <div class="modal-box">
            <p id="alert-msg">단어를 입력해주세요!</p>
            <button class="modal-btn" onclick="window.closeAlert()">확인</button>
        </div>
    </div>

    <div id="custom-confirm" class="modal-overlay">
        <div class="modal-box">
            <p id="confirm-msg">정말로 이 단어장을 삭제하시겠습니까?</p>
            <button id="confirm-yes" class="modal-btn">네, 삭제할게요</button>
            <button id="confirm-no" class="modal-btn cancel">취소</button>
        </div>
    </div>

    <div id="custom-prompt" class="modal-overlay">
        <div class="modal-box">
            <p id="prompt-msg">단어장 이름을 입력하세요</p>
            <input type="text" id="prompt-input" class="modal-input" placeholder="예: 5학년 1단원 복습" autocomplete="off">
            <button id="prompt-yes" class="modal-btn">저장</button>
            <button id="prompt-no" class="modal-btn cancel">취소</button>
        </div>
    </div>

    <div id="setup-screen">
        <h1>오늘의 교과서 영단어/문장</h1>
        
        <div class="setup-grid">
            <div>
                <div class="input-group">
                    <label>학습 데이터 종류</label>
                    <div class="mode-selection full-width">
                        <label class="mode-label mode-data">
                            <input type="radio" name="data-type" value="word" checked onchange="window.handleDataTypeChange()">
                            <span class="mode-title" style="font-size: 1.3rem;">단어 (Words)</span>
                        </label>
                        <label class="mode-label mode-data">
                            <input type="radio" name="data-type" value="sentence" onchange="window.handleDataTypeChange()">
                            <span class="mode-title" style="font-size: 1.3rem;">문장 (Sentences)</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label>자동 세팅 (교과서/내 저장소)</label>
                    <div class="flex-mobile-col" style="display: flex; gap: 10px;">
                        <select id="publisher-select" onchange="window.handlePublisherChange()">
                            <option value="ybm">YBM(김)</option>
                            <option value="ybm_choi" selected>YBM(최)</option>
                            <option value="donga">동아</option>
                            <option value="chunjae">천재(함)</option>
                            <option value="custom">내 단어장 (현재 브라우저 저장)</option>
                        </select>
                        <select id="grade-select" onchange="window.updateLessonOptions()">
                            <option value="">학년 선택</option>
                            <option value="3">3학년</option>
                            <option value="4">4학년</option>
                            <option value="5">5학년</option>
                            <option value="6" selected>6학년</option>
                        </select>
                        <select id="lesson-select" onchange="window.loadPresetWords()">
                            <option value="">단원 선택</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="lesson-info">단원 정보 표시</label>
                    <input type="text" id="lesson-info" placeholder="예: 6학년 Lesson 1" autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="word-list">데이터 직접 입력 (영어 | 한글 뜻)</label>
                    <div class="info-text">
                        <code>apple | 사과</code> 처럼 단어와 뜻을 '|' 기호로 구분하여 줄바꿈으로 입력하세요.
                    </div>
                    <textarea id="word-list" placeholder="apple | 사과&#10;banana | 바나나&#10;..."></textarea>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button id="save-custom-btn" class="modal-btn" style="flex:1; padding: 10px; font-size: 0.9rem;" onclick="window.saveCustomLesson()">💾 현재 데이터 내 단어장에 저장</button>
                        <button id="delete-custom-btn" class="modal-btn cancel" style="flex:1; padding: 10px; font-size: 0.9rem; display:none;" onclick="window.deleteCustomLesson()">🗑️ 이 단어장 삭제</button>
                    </div>
                </div>
            </div>

            <div>
                <div class="input-group">
                    <label>힌트 모드 설정</label>
                    <div class="mode-selection full-width">
                        <label class="mode-label mode-toggle">
                            <input type="radio" name="hint-mode" value="off" checked>
                            <span class="mode-title">힌트 숨기기 (기본)</span>
                            <span class="mode-desc">정답 확인 시에만 뜻 표시</span>
                        </label>
                        <label class="mode-label mode-toggle">
                            <input type="radio" name="hint-mode" value="on">
                            <span class="mode-title">힌트 항상 켜기</span>
                            <span class="mode-desc">문제 출제 시 한글 뜻 함께 표시</span>
                        </label>
                    </div>
                </div>

                <div class="input-group">
                    <label>게임 모드 선택</label>
                    <div class="mode-selection">
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="blur" checked onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">모자이크 깜빡이</span>
                            <span class="mode-desc">흐린 글자를 선명하게</span>
                        </label>
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="eraser" onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">지우개 배틀</span>
                            <span class="mode-desc">화면을 터치해 지우기</span>
                        </label>
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="mission" onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">미션 깜빡이</span>
                            <span class="mode-desc">무작위 목소리 미션</span>
                        </label>
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="memory" onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">카드 뒤집기</span>
                            <span class="mode-desc">짝맞추기 메모 게임</span>
                        </label>
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="flashlight" onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">Flashlight</span>
                            <span class="mode-desc">어둠 속에서 깜빡</span>
                        </label>
                        <label class="mode-label">
                            <input type="radio" name="game-mode" value="scramble" onchange="window.toggleModeSpecificInputs()">
                            <span class="mode-title">Scramble</span>

            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;

        let draggedElement = null;

        let originalLeft = 0, originalTop = 0;

        function handleDragStart(e) {
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            draggedElement = this;
            draggedElement.classList.add('dragging');
            originalLeft = parseFloat(draggedElement.style.left) || 0;
            originalTop = parseFloat(draggedElement.style.top) || 0;
            document.addEventListener('mousemove', handleDragMove);
            document.addEventListener('mouseup', handleDragEnd);
            document.addEventListener('touchmove', handleDragMove, {passive: false});
            document.addEventListener('touchend', handleDragEnd);
        }

        function handleDragMove(e) {
            if (!draggedElement) return;
            if (e.type === 'touchmove' && e.cancelable) e.preventDefault();
            let currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            let currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
            const dx = ((currentX - startX) / window.innerWidth) * 100;
            const dy = ((currentY - startY) / window.innerHeight) * 100;
            draggedElement.style.left = `${originalLeft + dx}%`;
            draggedElement.style.top = `${originalTop + dy}%`;
        }

        function handleDragEnd() {
            if (!draggedElement) return;
            draggedElement.classList.remove('dragging');
            draggedElement = null;
            document.removeEventListener('mousemove', handleDragMove);
            document.removeEventListener('mouseup', handleDragEnd);
            document.removeEventListener('touchmove', handleDragMove);
            document.removeEventListener('touchend', handleDragEnd);

        window.handleDataTypeChange = function() {
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            const blurLabel = document.querySelector('input[value="blur"]').closest('.mode-label');
            const eraserLabel = document.querySelector('input[value="eraser"]').closest('.mode-label');
            const missionLabel = document.querySelector('input[value="mission"]').closest('.mode-label');
            const memoryLabel = document.querySelector('input[value="memory"]').closest('.mode-label');
            const flashlightLabel = document.querySelector('input[value="flashlight"]').closest('.mode-label');
            const scrambleLabel = document.querySelector('input[value="scramble"]').closest('.mode-label');
            const unjumbleLabel = document.querySelector('input[value="unjumble"]').closest('.mode-label');

            const allLabels = [blurLabel, eraserLabel, missionLabel, memoryLabel, flashlightLabel, scrambleLabel, unjumbleLabel];
            allLabels.forEach(label => label.classList.remove('disabled-mode'));

            if (dataType === 'word') {
                unjumbleLabel.classList.add('disabled-mode');
                if (document.querySelector('input[value="unjumble"]').checked) {
                    document.querySelector('input[value="blur"]').checked = true;
                    window.toggleModeSpecificInputs();
                }
            } else if (dataType === 'sentence') {
                scrambleLabel.classList.add('disabled-mode');
                memoryLabel.classList.add('disabled-mode');
                if (['scramble', 'memory'].includes(document.querySelector('input[name="game-mode"]:checked').value)) {
                    document.querySelector('input[value="eraser"]').checked = true;
                    window.toggleModeSpecificInputs();
                }
            }
            window.loadPresetWords();
        }

            else if (publisher === 'chunjae' && grade === "6") maxLesson = 10;
            else if (publisher === 'ybm' && grade === "6") maxLesson = 12;
            else if (publisher === 'chunjae' && (grade === "4" || grade === "5")) maxLesson = 11;
            else if (publisher === 'ybm' && grade === "3") maxLesson = 11;

        window.loadPresetWords = function() {
            const publisher = document.getElementById('publisher-select').value;
            const lesson = document.getElementById('lesson-select').value;
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            
            if (publisher === 'custom') {
                if (!lesson || !customLessonsMap[lesson]) {
                    document.getElementById('word-list').value = ''; document.getElementById('lesson-info').value = '';
                    document.getElementById('delete-custom-btn').style.display = 'none'; return;
                }
                const lessonData = customLessonsMap[lesson];
                if (lessonData.dataType && lessonData.dataType !== dataType) {
                    const typeRadios = document.getElementsByName('data-type');
                    for (const r of typeRadios) {
                        if (r.value === lessonData.dataType) {
                            r.checked = true; window.handleDataTypeChange(); return;
                        }
                    }
                }
                document.getElementById('word-list').value = lessonData.words || '';
                document.getElementById('lesson-info').value = lessonData.title;
                document.getElementById('delete-custom-btn').style.display = 'block';
                return;
            }

            const grade = document.getElementById('grade-select').value;
            if (!grade || !lesson) return;

            const modeLabel = dataType === 'word' ? '단어' : '문장';
            let pubLabel = '';
            if(publisher === 'ybm') pubLabel = 'YBM(김)';
            else if(publisher === 'ybm_choi') pubLabel = 'YBM(최)';
            else if(publisher === 'donga') pubLabel = '동아';
            else if(publisher === 'chunjae') pubLabel = '천재(함)';
            
            document.getElementById('lesson-info').value = `${pubLabel} ${grade}학년 Lesson ${lesson} (${modeLabel})`;

            let presetWords = [];
            if (publisher === 'ybm') {
                presetWords = dataType === 'word' ? (ybmWordDatabase[grade]?.[lesson] || []) : (ybmSentenceDatabase[grade]?.[lesson] || []);
            } else if (publisher === 'ybm_choi') {
                presetWords = dataType === 'word' ? (ybmChoiWordDatabase[grade]?.[lesson] || []) : (ybmChoiSentenceDatabase[grade]?.[lesson] || []);
            } else if (publisher === 'donga') {
                presetWords = dataType === 'word' ? (dongaWordDatabase[grade]?.[lesson] || []) : (dongaSentenceDatabase[grade]?.[lesson] || []);
            } else if (publisher === 'chunjae') {
                presetWords = dataType === 'word' ? (chunjaeWordDatabase[grade]?.[lesson] || []) : (chunjaeSentenceDatabase[grade]?.[lesson] || []);
            }
            
            if (presetWords.length > 0) {
                document.getElementById('word-list').value = presetWords.join('\n');
            } else {
                document.getElementById('word-list').value = '';
                document.getElementById('word-list').placeholder = `관리자가 아직 이 단원의 ${modeLabel} 데이터를 입력하지 않았습니다.\n직접 입력해주세요!`;
            }
        }

        window.startGame = function() {
            const rawWords = document.getElementById('word-list').value;
            const parsedLines = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
            if (parsedLines.length === 0) {
                window.showAlert("게임을 시작하려면 내용을 최소 1줄 이상 입력해주세요!");
                document.getElementById('word-list').focus(); return;
            }

            let modeRadios = document.getElementsByName('game-mode');
            for (const radio of modeRadios) { if (radio.checked) { currentMode = radio.value; break; } }
            
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            if (dataType === 'sentence' && (currentMode === 'scramble' || currentMode === 'memory')) {
                window.showAlert("해당 모드는 '단어' 전용 게임입니다!\n[📝 단어 불러오기]를 선택하시거나 다른 게임을 골라주세요."); return;
            }
            if (dataType === 'word' && currentMode === 'unjumble') {
                window.showAlert("🧩 문장 조립 모드는 '문장' 전용 게임입니다!\n[💬 문장 불러오기]를 선택하시거나 다른 게임을 골라주세요."); return;
            }
            
            const hintRadios = document.getElementsByName('hint-mode');
            for (const radio of hintRadios) { if (radio.checked) { isHintModeOn = (radio.value === 'on'); break; } }
            const stopwatchRadios = document.getElementsByName('stopwatch-mode');
            for (const radio of stopwatchRadios) { if (radio.checked) { isStopwatchOn = (radio.value === 'on'); break; } }
            const memoryTimeRadios = document.getElementsByName('memory-time');
            for (const radio of memoryTimeRadios) { if (radio.checked) { memoryTimeInSeconds = parseInt(radio.value); break; } }

            words = [];
            parsedLines.forEach(line => {
                let en = line; let ko = "";
                if (line.includes('|')) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 2) { en = parts[0]; ko = parts[1]; }
                } else if (line.includes(',')) {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 2) { en = parts[0]; ko = parts[1]; }
                }

                if (currentMode === 'unjumble' && ko) {
                    words.push({ type: 'jumble', en: en, ko: ko });      
                    words.push({ type: 'translation', en: en, ko: ko }); 
                } else { words.push({ type: 'standard', en: en, ko: ko }); }
            });

            words = shuffleArray(words);
            const timeInSeconds = parseInt(document.getElementById('time').value);
            timeInMilliseconds = (timeInSeconds > 0 ? timeInSeconds : 3) * 1000;

            const lessonInfo = document.getElementById('lesson-info').value.trim();
            document.getElementById('lesson-info-display').innerText = lessonInfo;
            document.getElementById('lesson-info-display').style.display = lessonInfo ? 'block' : 'none';

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            currentWordIndex = 0; playCurrentWord();
        }

        window.reduceBlur = function() {
            if (currentBlur > 0) { currentBlur -= 10; if (currentBlur < 0) currentBlur = 0; }
            else { hiddenBlur -= 10; if (hiddenBlur < 0) hiddenBlur = 0; }
            
            const spans = document.getElementById('blur-word').querySelectorAll('span');
            if (spans.length > 0) {
                spans.forEach((span, i) => {
                    if (!hiddenIndices.includes(i)) span.style.filter = `blur(${currentBlur}px)`;
                    else span.style.filter = `blur(${hiddenBlur}px)`;
                });
            } else { document.getElementById('blur-word').style.filter = `blur(${currentBlur}px)`; }
            if (currentBlur === 0 && hiddenBlur === 0) document.getElementById('hint-btn').style.display = 'none';
        }

        function createUnjumbleChunk(text, index) {
            const pastelColors = ['#ff9ff3', '#feca57', '#48dbfb', '#1dd1a1', '#ff6b6b', '#a29bfe'];
            const btn = document.createElement('div');
            btn.className = 'unjumble-chunk'; btn.innerText = text; btn.style.backgroundColor = pastelColors[index % pastelColors.length];
            btn.onclick = function() {
                if (btn.parentElement.id === 'unjumble-pool-area') document.getElementById('unjumble-answer-area').appendChild(btn);
                else document.getElementById('unjumble-pool-area').appendChild(btn);
            };
            return btn;
        }

        function playCurrentWord() {
            if (timerId !== null) { clearTimeout(timerId); timerId = null; }
            const currentItem = words[currentWordIndex];
            const originalWord = currentItem ? currentItem.en : "";
            const koreanHintText = currentItem ? currentItem.ko : "";

            const actionContainer = document.getElementById('action-container');
            const actionBtn = document.getElementById('main-action-btn');
            const actionMsg = document.getElementById('action-message');
            
            actionMsg.style.background = ""; actionMsg.style.padding = ""; actionMsg.style.borderRadius = ""; actionMsg.style.backdropFilter = ""; actionMsg.style.boxShadow = ""; actionMsg.style.color = ""; actionMsg.style.fontSize = "";
            actionContainer.style.display = 'none';
            document.getElementById('answer-display').style.display = 'none'; document.getElementById('word-display').style.display = 'none';
            
            const scrambleContainer = document.getElementById('scramble-container');
            scrambleContainer.style.display = 'none'; scrambleContainer.innerHTML = ''; 
            const unjumbleContainer = document.getElementById('unjumble-container');
            unjumbleContainer.style.display = 'none';
            document.getElementById('unjumble-answer-area').innerHTML = ''; document.getElementById('unjumble-pool-area').innerHTML = '';
            document.getElementById('blur-container').style.display = 'none';
            
            const eraserContainer = document.getElementById('eraser-container');
            eraserContainer.style.display = 'none'; eraserContainer.innerHTML = '';
            const memoryContainer = document.getElementById('memory-container');
            memoryContainer.style.display = 'none'; memoryContainer.innerHTML = '';
            document.getElementById('flashlight-overlay').style.opacity = '0';
            
            const darkness = document.getElementById('darkness');
            darkness.className = ''; darkness.style.opacity = '0'; 
            
            document.getElementById('prev-btn').style.display = 'none'; document.getElementById('retry-btn').style.display = 'none'; document.getElementById('hint-btn').style.display = 'none';
            window.updateProgress();
            
            if (currentMode === 'memory') {
                currentState = 'playing'; document.getElementById('progress-display').style.display = 'none';
                let pairCount = Math.min(words.length, 10); let totalCards = pairCount * 2;
                let cols = window.innerWidth <= 600 ? 4 : (totalCards <= 16 ? 4 : 5);
                memoryContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

                let deck = [];
                for(let i = 0; i < pairCount; i++) {
                    deck.push({ text: words[i].en, id: i }); deck.push({ text: words[i].ko, id: i });
                }
                deck = shuffleArray(deck);

                deck.forEach((cardData, i) => {
                    const card = document.createElement('div'); card.className = 'memory-card flipped'; card.dataset.id = cardData.id;
                    const inner = document.createElement('div'); inner.className = 'memory-card-inner';
                    const front = document.createElement('div'); front.className = 'memory-card-front'; front.innerText = '?';
                    const back = document.createElement('div'); back.className = 'memory-card-back'; back.innerText = cardData.text;
                    inner.appendChild(front); inner.appendChild(back); card.appendChild(inner); memoryContainer.appendChild(card);
                    card.addEventListener('click', flipCard);
                });

                darkness.className = 'fully-dark'; darkness.style.opacity = '0.9'; 
                actionContainer.className = 'action-center';
                actionMsg.innerText = memoryTimeInSeconds + "초간 카드의 짝을 기억하세요! 👀";
                actionMsg.style.fontSize = "clamp(2.5rem, 5vw, 4rem)"; actionMsg.style.background = 'rgba(0, 0, 0, 0.7)'; actionMsg.style.padding = '30px 50px'; actionMsg.style.borderRadius = '20px'; actionMsg.style.backdropFilter = 'blur(10px)'; actionMsg.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)'; actionMsg.style.color = '#fff'; actionMsg.style.display = 'inline-block';
                document.getElementById('action-korean-hint').style.display = 'none'; document.getElementById('btn-group').style.display = 'none'; actionContainer.style.display = 'block';

                let hasFlippedCard = false; let lockBoard = true; let firstCard, secondCard; let matchedCount = 0;

                timerId = setTimeout(() => {
                    actionContainer.style.display = 'none'; darkness.style.opacity = '0';
                    actionMsg.style.fontSize = ""; actionMsg.style.background = ""; actionMsg.style.padding = ""; actionMsg.style.borderRadius = ""; actionMsg.style.backdropFilter = ""; actionMsg.style.boxShadow = ""; actionMsg.style.color = ""; actionMsg.style.display = "";
                    memoryContainer.style.display = 'grid';

                    timerId = setTimeout(() => {
                        const cards = document.querySelectorAll('.memory-card');
                        actionContainer.className = 'action-bottom'; actionMsg.innerText = "짝을 맞춰보세요! 🃏"; actionContainer.style.display = 'block';
                        cards.forEach((card, i) => { setTimeout(() => { card.classList.remove('flipped'); }, i * 50); });
                        
                        setTimeout(() => {
                            lockBoard = false; setTimeout(() => { actionContainer.style.display = 'none'; }, 2000);
                            if (isStopwatchOn) { document.getElementById('stopwatch-display').style.display = 'flex'; startStopwatch(); }
                        }, cards.length * 50 + 500);
                    }, memoryTimeInSeconds * 1000);
                }, 2000);

                function flipCard() {
                    if (lockBoard) return; if (this === firstCard) return; if (this.classList.contains('matched')) return;
                    this.classList.add('flipped');
                    if (!hasFlippedCard) { hasFlippedCard = true; firstCard = this; return; }
                    secondCard = this; checkForMatch();
                }

                function checkForMatch() { let isMatch = firstCard.dataset.id === secondCard.dataset.id; isMatch ? disableCards() : unflipCards(); }
                function disableCards() {
                    firstCard.classList.add('matched'); secondCard.classList.add('matched'); matchedCount++; resetBoard();
                    if (matchedCount === pairCount) {
                        let finalTimeMs = 0; if (isStopwatchOn) finalTimeMs = stopStopwatch();
                        setTimeout(() => {
                            currentState = 'memory-won';
                            let winMsg = "🎉 미션 클리어! 🎉";
                            if (isStopwatchOn) { const finalSec = (finalTimeMs / 1000).toFixed(2); winMsg = `🎉 미션 클리어! 🎉\n기록: ${finalSec}초`; }
                            const endMsg = document.getElementById('action-message'); endMsg.innerText = winMsg;
                            endMsg.style.background = 'rgba(0, 0, 0, 0.85)'; endMsg.style.padding = '40px 60px'; endMsg.style.borderRadius = '24px'; endMsg.style.backdropFilter = 'blur(10px)'; endMsg.style.boxShadow = '0 15px 40px rgba(0,0,0,0.6)'; endMsg.style.display = 'inline-block'; endMsg.style.color = '#fff'; endMsg.style.fontSize = "clamp(2.5rem, 5vw, 4rem)";
                            actionBtn.innerText = "처음으로 돌아가기"; actionBtn.className = 'action-btn end-btn'; document.getElementById('btn-group').style.display = 'flex'; actionContainer.className = 'action-center'; actionContainer.style.display = 'block';
                        }, 1000);
                    }
                }
                function unflipCards() { lockBoard = true; setTimeout(() => { firstCard.classList.remove('flipped'); secondCard.classList.remove('flipped'); resetBoard(); }, 1000); }
                function resetBoard() { [hasFlippedCard, lockBoard] = [false, false]; [firstCard, secondCard] = [null, null]; }
            }
            else if (currentMode === 'blur') {
                currentState = 'writing'; currentBlur = 35; hiddenBlur = 35; 
                document.getElementById('blur-container').style.display = 'block'; document.getElementById('mission-text').style.display = 'none';
                const blurWord = document.getElementById('blur-word'); blurWord.innerHTML = ''; blurWord.style.color = '#339af0'; 
                const chars = originalWord.split(''); let validIndices = []; chars.forEach((c, i) => { if (c.trim() !== '') validIndices.push(i); });
                let hideCount = 1; if (validIndices.length >= 5) hideCount = 2; if (validIndices.length >= 7) hideCount = 3; 
                hiddenIndices = shuffleArray(validIndices).slice(0, hideCount);
                chars.forEach((char, i) => {
                    const span = document.createElement('span'); span.innerText = char;
                    if (char === ' ') span.style.marginRight = '15px'; 
                    span.style.filter = `blur(${currentBlur}px)`; span.style.transition = 'filter 0.5s ease'; blurWord.appendChild(span);
                });
                if(isHintModeOn && koreanHintText) { document.getElementById('blur-ko').innerText = koreanHintText; document.getElementById('blur-ko').style.display = 'block'; } else { document.getElementById('blur-ko').style.display = 'none'; }
                actionContainer.className = 'action-bottom'; document.getElementById('action-message').style.display = 'none'; document.getElementById('action-korean-hint').style.display = 'none'; document.getElementById('btn-group').style.display = 'flex';
                document.getElementById('hint-btn').style.display = 'inline-block'; document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료"; actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                actionContainer.style.display = 'block';
            }
            else if (currentMode === 'eraser') {
                currentState = 'playing'; document.getElementById('progress-display').style.display = 'none'; 
                eraserContainer.style.display = 'flex';
                let cardItems = []; words.forEach(w => { if(w.en) cardItems.push(w.en); if(w.ko) cardItems.push(w.ko); });
                cardItems = shuffleArray(cardItems); 
                const pastelColors = ['#ff9ff3', '#feca57', '#48dbfb', '#1dd1a1', '#ff6b6b', '#a29bfe'];
                cardItems.forEach((text, i) => {
                    const card = document.createElement('div'); card.className = 'eraser-card'; card.innerText = text; card.style.backgroundColor = pastelColors[i % pastelColors.length];
                    card.onclick = function() { card.classList.add('erased'); }; eraserContainer.appendChild(card);
                });
            }
            else if (currentMode === 'mission') {
                currentState = 'writing'; document.getElementById('blur-container').style.display = 'block';
                const missionText = document.getElementById('mission-text'); missionText.innerText = missions[Math.floor(Math.random() * missions.length)]; missionText.style.display = 'inline-block';
                const blurWord = document.getElementById('blur-word'); blurWord.innerHTML = ''; blurWord.innerText = originalWord; blurWord.style.color = '#ff8787';
                if(isHintModeOn && koreanHintText) { document.getElementById('blur-ko').innerText = koreanHintText; document.getElementById('blur-ko').style.display = 'block'; } else { document.getElementById('blur-ko').style.display = 'none'; }
                actionContainer.className = 'action-bottom'; document.getElementById('action-message').style.display = 'none'; document.getElementById('action-korean-hint').style.display = 'none'; document.getElementById('btn-group').style.display = 'flex';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료"; actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                actionContainer.style.display = 'block';
            }
            else if (currentMode === 'unjumble') {
                currentState = 'writing'; const unjumbleContainer = document.getElementById('unjumble-container'); unjumbleContainer.style.display = 'flex';
                darkness.className = 'fully-dark'; darkness.style.opacity = '0.6'; 
                const poolArea = document.getElementById('unjumble-pool-area');
                const actionMessage = document.getElementById('action-message'); const actionKoreanHint = document.getElementById('action-korean-hint');

                if (currentItem.type === 'jumble' || currentItem.type === 'standard') {
                    unjumbleContainer.style.display = 'flex'; actionMessage.innerText = "단어를 클릭해 문장을 완성하세요 🧩"; actionContainer.className = 'action-bottom'; document.getElementById('btn-group').style.display = 'flex';
                    if(isHintModeOn && koreanHintText) { actionKoreanHint.innerText = `"${koreanHintText}"`; actionKoreanHint.style.display = 'block'; } else { actionKoreanHint.style.display = 'none'; }
                    const chunks = originalWord.split(' ').filter(c => c.trim().length > 0); let shuffledChunks = shuffleArray(chunks.slice());
                    if(chunks.length > 1) { let attempts = 0; while (shuffledChunks.join(' ') === chunks.join(' ') && attempts < 10) { shuffledChunks = shuffleArray(chunks.slice()); attempts++; } }
                    shuffledChunks.forEach((text, i) => { poolArea.appendChild(createUnjumbleChunk(text, i)); });
                } 
                else if (currentItem.type === 'translation') {
                    unjumbleContainer.style.display = 'none'; actionMessage.innerText = "다음 뜻에 맞는 영어 문장을 말해보세요 🗣️"; actionKoreanHint.innerText = `"${koreanHintText}"`; actionKoreanHint.style.display = 'block'; actionContainer.className = 'action-translation'; document.getElementById('btn-group').style.display = 'flex';
                }
                actionBtn.innerText = "정답 확인"; actionBtn.className = 'action-btn'; document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            } 
            else if (currentMode === 'scramble') {
                currentState = 'writing'; scrambleContainer.style.display = 'block';
                darkness.className = 'fully-dark'; darkness.style.opacity = '0.6'; 
                const placedPositions = []; const minDistance = 14; const chars = originalWord.split('');
                chars.forEach(char => {
                    if(char.trim() === '') return; 
                    const span = document.createElement('span'); span.innerText = char; span.className = 'scattered-letter';
                    let top, left; let attempts = 0; let validPosition = false;
                    while (!validPosition && attempts < 50) {
                        top = 20 + Math.random() * 40; left = 10 + Math.random() * 70;  validPosition = true;
                        for (let pos of placedPositions) {
                            const dx = pos.left - left; const dy = pos.top - top; 
                            if (Math.sqrt(dx*dx + dy*dy) < minDistance) { validPosition = false; break; }
                        }
                        attempts++;
                    }
                    placedPositions.push({top, left}); span.style.top = `${top}%`; span.style.left = `${left}%`; span.style.transform = `rotate(${-15 + Math.random() * 30}deg)`;
                    span.addEventListener('mousedown', handleDragStart); span.addEventListener('touchstart', handleDragStart, {passive: false});
                    scrambleContainer.appendChild(span);
                });
                actionContainer.className = 'action-bottom'; document.getElementById('action-message').innerText = "Guess the Word! 🤔"; document.getElementById('action-message').style.display = 'block'; document.getElementById('btn-group').style.display = 'flex';
                if(isHintModeOn && koreanHintText) { document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`; document.getElementById('action-korean-hint').style.display = 'block'; } else { document.getElementById('action-korean-hint').style.display = 'none'; }
                actionBtn.innerText = "정답 확인"; actionBtn.className = 'action-btn'; document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            } 
            else if (currentMode === 'flashlight') {
                currentState = 'showing';
                const wordDisplay = document.getElementById('word-display'); wordDisplay.innerText = originalWord; wordDisplay.style.display = 'block';
                darkness.className = ''; darkness.style.opacity = '1';
                setTimeout(() => { if(currentState === 'showing') { darkness.classList.add('spotlight-on'); document.getElementById('flashlight-overlay').style.opacity = '1'; } }, 500);
                timerId = setTimeout(() => { showWritePrompt(); }, timeInMilliseconds + 500);
            }
        }

        function showWritePrompt() {
            currentState = 'writing'; const currentItem = words[currentWordIndex]; const koreanHintText = currentItem ? currentItem.ko : "";
            const darkness = document.getElementById('darkness'); darkness.className = 'fully-dark'; darkness.style.opacity = '1'; document.getElementById('flashlight-overlay').style.opacity = '0'; document.getElementById('word-display').style.display = 'none';
            const actionContainer = document.getElementById('action-container'); actionContainer.className = 'action-center'; document.getElementById('action-message').innerText = "Time to Write! ✍️"; document.getElementById('action-message').style.display = 'block'; document.getElementById('btn-group').style.display = 'flex';
            if(isHintModeOn && koreanHintText) { document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`; document.getElementById('action-korean-hint').style.display = 'block'; } else { document.getElementById('action-korean-hint').style.display = 'none'; }
            const actionBtn = document.getElementById('main-action-btn'); actionBtn.innerText = "정답 확인"; actionBtn.className = 'action-btn';
            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none'; document.getElementById('retry-btn').style.display = 'inline-block';
            setTimeout(() => { actionContainer.style.display = 'block'; }, 500);
        }

        window.handleActionClick = function() {
            if (currentState === 'writing') showAnswer();
            else if (currentState === 'answered') window.nextWord();
            else if (currentState === 'memory-won') window.resetGame();
        }

        function showAnswer() {
            currentState = 'answered'; const currentItem = words[currentWordIndex]; const koreanHintText = currentItem ? currentItem.ko : "";
            const actionContainer = document.getElementById('action-container'); const actionBtn = document.getElementById('main-action-btn');
            const scrambleContainer = document.getElementById('scramble-container'); scrambleContainer.style.display = 'none'; scrambleContainer.innerHTML = ''; 
            document.getElementById('unjumble-container').style.display = 'none';

            if (['blur', 'mission'].includes(currentMode)) {
                const spans = document.getElementById('blur-word').querySelectorAll('span');
                if(spans.length > 0) spans.forEach(span => span.style.filter = 'blur(0px)'); else document.getElementById('blur-word').style.filter = 'blur(0px)';
                document.getElementById('hint-btn').style.display = 'none';
                document.getElementById('blur-word').innerText = currentItem.en; document.getElementById('blur-word').style.display = 'block'; document.getElementById('blur-word').style.color = '#339af0'; 
                if(koreanHintText) { document.getElementById('blur-ko').innerText = koreanHintText; document.getElementById('blur-ko').style.display = 'block'; }
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료"; actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn'; return; 
            }

            if (currentMode === 'unjumble' && currentItem.type === 'translation') actionContainer.className = 'action-translation'; else actionContainer.className = 'action-center';
            document.getElementById('action-message').style.display = 'none';
            if(koreanHintText) { document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`; document.getElementById('action-korean-hint').style.display = 'block'; } else { document.getElementById('action-korean-hint').style.display = 'none'; }
            document.getElementById('hint-btn').style.display = 'none';
            const answerDisplay = document.getElementById('answer-display'); answerDisplay.innerText = currentItem.en; answerDisplay.style.display = 'flex';
            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none'; document.getElementById('retry-btn').style.display = 'inline-block';
            if (currentWordIndex < words.length - 1) { actionBtn.innerText = "다음 문제 ➔"; actionBtn.className = 'action-btn next-btn'; } else { actionBtn.innerText = "🎉 게임 종료"; actionBtn.className = 'action-btn end-btn'; }
        }

        window.nextWord = function() { if (timerId !== null) { clearTimeout(timerId); timerId = null; } if (currentWordIndex < words.length - 1) { currentWordIndex++; playCurrentWord(); } else window.resetGame(); }
        window.prevWord = function() { if (timerId !== null) { clearTimeout(timerId); timerId = null; } if (currentWordIndex > 0) { currentWordIndex--; playCurrentWord(); } }
        window.retryProblem = function() { if (timerId !== null) { clearTimeout(timerId); timerId = null; } playCurrentWord(); }
        window.updateProgress = function() { document.getElementById('progress-display').innerText = `Word ${currentWordIndex + 1} / ${words.length}`; }

        function startStopwatch() {
            stopwatchStartTime = Date.now(); updateStopwatchDisplay(0);
            stopwatchIntervalId = setInterval(() => { const elapsed = Date.now() - stopwatchStartTime; updateStopwatchDisplay(elapsed); }, 10);
        }
        function updateStopwatchDisplay(ms) {
            const totalSeconds = Math.floor(ms / 1000); const minutes = Math.floor(totalSeconds / 60); const seconds = totalSeconds % 60; const centiseconds = Math.floor((ms % 1000) / 10);
            document.getElementById('stopwatch-display').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }
        function stopStopwatch() { if (stopwatchIntervalId !== null) { clearInterval(stopwatchIntervalId); stopwatchIntervalId = null; } return Date.now() - stopwatchStartTime; }

        window.resetGame = function() {
            if (timerId !== null) { clearTimeout(timerId); timerId = null; }
            stopStopwatch(); document.getElementById('stopwatch-display').style.display = 'none'; document.getElementById('stopwatch-display').innerText = "00:00.00";
            document.getElementById('game-screen').style.display = 'none'; document.getElementById('setup-screen').style.display = 'block'; document.getElementById('progress-display').style.display = 'block'; 
            
            const scrambleContainer = document.getElementById('scramble-container'); scrambleContainer.innerHTML = ''; scrambleContainer.style.display = 'none';
            document.getElementById('unjumble-container').style.display = 'none'; document.getElementById('blur-container').style.display = 'none';
            document.getElementById('eraser-container').style.display = 'none'; document.getElementById('eraser-container').innerHTML = '';
            
            const actionMsg = document.getElementById('action-message'); actionMsg.style.background = ""; actionMsg.style.padding = ""; actionMsg.style.borderRadius = ""; actionMsg.style.backdropFilter = ""; actionMsg.style.boxShadow = ""; actionMsg.style.color = ""; actionMsg.style.fontSize = "";
            document.getElementById('memory-container').style.display = 'none'; document.getElementById('memory-container').innerHTML = ''; document.getElementById('flashlight-overlay').style.opacity = '0';
        }

        window.quitGame = function() { window.showConfirm("정말로 게임을 종료하고 처음으로 돌아가시겠습니까?", function() { window.resetGame(); }); }
    </script>
