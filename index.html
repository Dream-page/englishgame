<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YBM Secret Word Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Jua&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff9e6; /* 기본 파스텔톤 아이보리 배경 */
            font-family: 'Nunito', 'Jua', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #2d3436;
        }

        /* ----- 커스텀 모달 (경고/확인창) ----- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #fff2cc;
            padding: 30px 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 400px;
            border: 4px solid #ffb8b8;
        }
        .modal-box p {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #2d3436;
            font-weight: bold;
        }
        .modal-btn {
            background: #74b9ff;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 15px;
            cursor: pointer;
            font-family: 'Jua', sans-serif;
            margin: 0 10px;
            transition: transform 0.2s;
            box-shadow: 0 5px 0 #0984e3;
        }
        .modal-btn:hover {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #0984e3;
        }
        .modal-btn.cancel {
            background: #b2bec3;
            box-shadow: 0 5px 0 #636e72;
        }
        .modal-btn.cancel:hover {
            box-shadow: 0 2px 0 #636e72;
        }

        /* ----- 설정 화면 (Setup Screen) ----- */
        #setup-screen {
            background-color: #e0f7fa; 
            padding: 30px 40px;
            border-radius: 30px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            width: 90%;
            max-width: 800px;
            max-height: 95vh;
            overflow-y: auto;
            border: 5px solid #81ecec;
        }

        #setup-screen h1 {
            font-family: 'Fredoka One', 'Jua', cursive;
            color: #ff7675;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2.8rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px #fff;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3436;
        }

        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px;
            font-size: 1.1rem;
            border: 3px solid #fff;
            border-radius: 15px;
            box-sizing: border-box;
            background-color: #fff;
            color: #333;
            font-family: 'Nunito', 'Jua', sans-serif;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }
        .input-group input:focus, .input-group textarea:focus, .input-group select:focus {
            outline: none;
            border-color: #fdcb6e;
        }

        .input-group select {
            cursor: pointer;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .mode-selection {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .mode-label {
            flex: 1;
            min-width: 150px;
            background: #fff;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            text-align: center;
            border: 3px solid #dfe6e9;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #dfe6e9;
            color: #2d3436;
        }

        .mode-label input[type="radio"] {
            display: none;
        }

        .mode-label:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #dfe6e9;
        }

        /* 5분 워밍업 게임 스타일 */
        .mode-warmup:has(input[type="radio"]:checked) {
            border-color: #ff9ff3;
            background: #ffeaa7;
            box-shadow: 0 4px 0 #ff9ff3;
        }

        /* 집중 모드 스타일 */
        .mode-focus:has(input[type="radio"]:checked) {
            border-color: #0984e3;
            background: #74b9ff;
            color: white;
            box-shadow: 0 4px 0 #0984e3;
        }

        /* 학습 데이터 종류 버튼 전용 활성화 스타일 (단어/문장 불러오기) */
        .mode-data:has(input[type="radio"]:checked) {
            border-color: #00b894;
            background: #55efc4;
            color: #2d3436;
            box-shadow: 0 4px 0 #00b894;
            font-weight: bold;
        }

        /* 힌트 토글 스타일 */
        .mode-toggle:has(input[type="radio"]:checked) {
            border-color: #fdcb6e;
            background: #ffeaa7;
            color: #2d3436;
            box-shadow: 0 4px 0 #fdcb6e;
            font-weight: bold;
        }

        .mode-title {
            display: block;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 1.2rem;
            margin-bottom: 4px;
        }

        .mode-desc {
            font-size: 0.85rem;
            opacity: 0.8;
        }

        button.start-btn {
            background-color: #fdcb6e;
            color: #2d3436;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 1.8rem;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 6px 0 #e1b12c;
        }

        button.start-btn:hover {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #e1b12c;
            background-color: #ffeaa7;
        }

        /* ----- 게임 화면 (Game Screen) ----- */
        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            background-color: #fff9e6; 
            background-size: cover;
            background-position: center;
            transition: background-color 0.5s ease;
        }

        /* 상단 상태바 */
        #top-bar {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            padding: 0 40px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
        }

        #top-bar > div {
            pointer-events: auto; 
        }

        #lesson-info-display, #progress-display {
            padding: 5px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .quit-btn {
            background-color: #ff7675;
            color: white;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 1.2rem;
            padding: 5px 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #d63031;
        }
        .quit-btn:hover {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #d63031;
        }

        /* -------------------------------------
           ✨ 5분 워밍업 게임 관련 컨테이너 ✨
        ------------------------------------- */

        #blur-container {
            display: none;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 5;
        }

        #mission-text {
            font-family: 'Jua', sans-serif;
            font-size: clamp(3rem, 6vw, 5rem);
            color: #ff6b6b;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 40px;
            border-radius: 30px;
            display: inline-block;
            border: 4px dashed #ff9ff3;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            animation: float 2s infinite ease-in-out;
        }

        #blur-word {
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(5rem, 10vw, 12rem);
            font-weight: bold;
            color: #0984e3;
            transition: filter 0.5s ease;
            text-shadow: 2px 2px 0 #fff;
            word-break: keep-all;
        }

        #blur-ko {
            font-family: 'Jua', sans-serif;
            font-size: clamp(3rem, 6vw, 6rem);
            color: #636e72;
            margin-top: 15px;
        }

        #eraser-container {
            display: none;
            position: absolute;
            top: 100px;
            left: 5%;
            width: 90%;
            height: calc(100vh - 120px);
            overflow-y: auto;
            flex-wrap: wrap;
            gap: 20px;
            align-content: flex-start;
            justify-content: center;
            padding-bottom: 40px;
            z-index: 5;
        }

        .eraser-card {
            background-color: #ff9ff3;
            color: white;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            padding: 20px 40px;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 8px 0 rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            user-select: none;
            text-align: center;
            border: 3px solid rgba(255,255,255,0.4);
        }
        .eraser-card:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.1);
        }
        .eraser-card.erased {
            opacity: 0;
            transform: scale(0.1) rotate(45deg);
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* -------------------------------------
           기존 심화 게임 관련 컨테이너
        ------------------------------------- */
        #flashlight-overlay {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) rotate(-10deg);
            width: 800px;
            height: 800px;
            background-image: url('flashlight.jpg'), url('—Pngtree—flashlight with yellow light_6930226.jpg');
            background-repeat: no-repeat;
            background-position: center bottom;
            background-size: contain;
            mix-blend-mode: screen; 
            opacity: 0;
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #word-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(4rem, 8vw, 9rem);
            z-index: 1;
            text-align: center;
            letter-spacing: 5px;
            width: 100%;
            word-wrap: break-word;
            padding: 0 20px;
            box-sizing: border-box;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        #scramble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
        }

        .scattered-letter {
            position: absolute;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 7rem;
            color: #2ecc71; 
            text-shadow: 4px 4px 0px #27ae60, 2px 2px 10px rgba(0,0,0,0.8);
            display: inline-block;
            transition: transform 0.2s;
            cursor: grab;
            user-select: none;
            touch-action: none;
        }
        .scattered-letter.dragging {
            cursor: grabbing;
            transform: scale(1.3) !important;
            z-index: 100;
            transition: none;
        }

        #unjumble-container {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 90%;
            height: 70%;
            z-index: 4;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        #unjumble-answer-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            min-height: 100px;
            width: 90%;
            justify-content: center;
            align-items: center;
            align-content: flex-start;
            border-bottom: 4px dashed rgba(255, 255, 255, 0.4);
            padding-bottom: 20px;
        }

        #unjumble-pool-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            width: 90%;
            justify-content: center;
            align-items: center;
            align-content: flex-start;
        }

        .unjumble-chunk {
            background-color: #9b59b6;
            color: white;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(2rem, 4vw, 3rem);
            padding: 12px 25px;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 6px 0 #732d91;
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }
        .unjumble-chunk:active {
            transform: translateY(6px);
            box-shadow: none;
        }

        #darkness {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2;
            transition: background 0.3s ease;
        }

        .spotlight-on {
            background: radial-gradient(circle at 50% 50%, transparent 400px, rgba(0,0,0,0.98) 700px) !important;
        }
        
        .fully-dark {
            background: rgba(0,0,0,0.95) !important;
        }

        #action-container {
            display: none;
            position: absolute;
            text-align: center;
            z-index: 10;
            width: 100%;
        }

        .action-center {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .action-bottom {
            top: auto;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .action-translation {
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
        }

        .action-translation #action-message {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem !important; 
            margin: 0;
            width: 100%;
        }

        .action-translation #action-korean-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(4rem, 8vw, 8rem) !important; 
            margin: 0;
            width: 100%;
            display: none;
        }

        .action-translation #answer-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(4rem, 8vw, 8rem) !important; 
            margin: 0;
            width: 100%;
        }

        .action-translation #btn-group {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin: 0;
        }

        #action-message {
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 4.5rem;
            color: #f1c40f;
            margin: 0 0 15px 0;
            animation: bounce 1s infinite alternate;
            text-shadow: 4px 4px 0px #d35400; 
        }

        .action-bottom #action-message {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        #action-korean-hint {
            font-family: 'Jua', sans-serif;
            font-size: clamp(3.5rem, 6vw, 6rem);
            color: #ecf0f1;
            margin-bottom: 25px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
            word-break: keep-all;
            padding: 0 20px;
            display: none;
        }

        #answer-display {
            display: none;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: clamp(3rem, 6vw, 7rem); 
            color: #3498db;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0px #2980b9;
            word-break: keep-all;
            padding: 0 20px;
            text-align: center;
            width: 100%;
            justify-content: center;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        button.action-btn {
            background-color: #0984e3;
            color: white;
            font-family: 'Fredoka One', 'Jua', cursive;
            font-size: 1.8rem;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 6px 0 #0056b3;
        }
        button.action-btn:hover {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0056b3;
            background-color: #74b9ff;
        }

        button.action-btn.hint-btn {
            background-color: #feca57;
            color: #2d3436;
            box-shadow: 0 6px 0 #ff9f43;
        }
        button.action-btn.hint-btn:hover {
            background-color: #ffdd59;
            box-shadow: 0 3px 0 #ff9f43;
        }

        button.action-btn.next-btn {
            background-color: #a29bfe;
            box-shadow: 0 6px 0 #6c5ce7;
        }
        button.action-btn.next-btn:hover {
            background-color: #c8d6e5;
            box-shadow: 0 3px 0 #6c5ce7;
        }

        button.action-btn.end-btn {
            background-color: #ff7675;
            box-shadow: 0 6px 0 #d63031;
        }

        button.action-btn.prev-btn {
            background-color: #7f8c8d;
            box-shadow: 0 6px 0 #636e72;
        }
        button.action-btn.prev-btn:hover {
            background-color: #95a5a6;
            box-shadow: 0 3px 0 #636e72;
        }

        button.action-btn.retry-btn {
            background-color: #e67e22;
            box-shadow: 0 6px 0 #d35400;
        }
        button.action-btn.retry-btn:hover {
            background-color: #f39c12;
            box-shadow: 0 3px 0 #d35400;
        }

        #btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <div id="custom-alert" class="modal-overlay">
        <div class="modal-box">
            <p id="alert-msg">단어를 입력해주세요!</p>
            <button class="modal-btn" onclick="closeAlert()">확인</button>
        </div>
    </div>

    <div id="custom-confirm" class="modal-overlay">
        <div class="modal-box">
            <p id="confirm-msg">정말로 게임을 종료하고 처음으로 돌아가시겠습니까?</p>
            <button id="confirm-yes" class="modal-btn">네 (나가기)</button>
            <button id="confirm-no" class="modal-btn cancel">아니요</button>
        </div>
    </div>

    <div id="setup-screen">
        <h1>🎮 Secret Word Game 🎮</h1>
        
        <div class="input-group">
            <label>📖 학습 데이터 종류</label>
            <div class="mode-selection" style="margin-bottom: 10px;">
                <label class="mode-label mode-data" style="padding: 10px;">
                    <input type="radio" name="data-type" value="word" checked onchange="loadPresetWords()">
                    <span>📝 단어 불러오기</span>
                </label>
                <label class="mode-label mode-data" style="padding: 10px;">
                    <input type="radio" name="data-type" value="sentence" onchange="loadPresetWords()">
                    <span>💬 문장 불러오기</span>
                </label>
            </div>
            
            <label>📚 교과서 자동 세팅 (YBM)</label>
            <div style="display: flex; gap: 10px;">
                <select id="grade-select" onchange="updateLessonOptions()">
                    <option value="">학년 선택</option>
                    <option value="3">3학년</option>
                    <option value="4">4학년</option>
                    <option value="5">5학년</option>
                    <option value="6">6학년</option>
                </select>
                <select id="lesson-select" onchange="loadPresetWords()">
                    <option value="">단원 선택</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="lesson-info">단원 정보 (예: 3학년 Lesson 1)</label>
            <input type="text" id="lesson-info" placeholder="화면 상단에 표시됩니다 (생략 가능)" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="word-list">단어/문장 리스트 (엔터로 구분)</label>
            <div style="font-size: 0.85rem; color: #636e72; margin-bottom: 5px; background: white; padding: 10px; border-radius: 10px; line-height: 1.6;">
                <strong>[입력 방법 안내]</strong><br>
                * <code>영어단어 | 한글뜻</code> 형태로 입력해주세요.<br>
                * 예시: <code>apple | 사과</code>
            </div>
            <textarea id="word-list" placeholder="apple | 사과&#10;banana | 바나나&#10;..."></textarea>
        </div>

        <div class="input-group">
            <label>💡 힌트 모드 설정</label>
            <div class="mode-selection" style="margin-bottom: 10px;">
                <label class="mode-label mode-toggle" style="padding: 10px;">
                    <input type="radio" name="hint-mode" value="off" checked>
                    <span>👀 문제 나올 때 한글 뜻 숨기기 (기본)</span>
                </label>
                <label class="mode-label mode-toggle" style="padding: 10px;">
                    <input type="radio" name="hint-mode" value="on">
                    <span>💡 문제 나올 때 한글 뜻 항상 켜기</span>
                </label>
            </div>
            <div style="font-size: 0.85rem; color: #636e72;">* 정답을 확인할 때는 설정과 무관하게 한글 뜻이 나타납니다.</div>
        </div>

            document.getElementById('confirm-msg').innerText = msg;

            document.getElementById('confirm-yes').onclick = function() {
                document.getElementById('custom-confirm').style.display = 'none';
                if(onYes) onYes();
            };
            document.getElementById('confirm-no').onclick = function() {
                document.getElementById('custom-confirm').style.display = 'none';
            };
        }

        function shuffleArray(arr) {
            let array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        let activeDragElement = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        document.addEventListener('mousemove', handleDragMove);
        document.addEventListener('touchmove', handleDragMove, {passive: false});
        document.addEventListener('mouseup', handleDragEnd);
        document.addEventListener('touchend', handleDragEnd);

        function handleDragStart(e) {
            if (e.type === 'mousedown' && e.button !== 0) return;
            e.preventDefault();
            
            activeDragElement = this;
            activeDragElement.classList.add('dragging');
            
            if (activeDragElement.style.left.includes('%')) {
                const leftPercent = parseFloat(activeDragElement.style.left);
                const topPercent = parseFloat(activeDragElement.style.top);
                const containerRect = document.getElementById('scramble-container').getBoundingClientRect();
                activeDragElement.style.left = (leftPercent / 100 * containerRect.width) + 'px';
                activeDragElement.style.top = (topPercent / 100 * containerRect.height) + 'px';
            }
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            dragOffsetX = clientX - parseFloat(activeDragElement.style.left);
            dragOffsetY = clientY - parseFloat(activeDragElement.style.top);
        }

        function handleDragMove(e) {
            if (!activeDragElement) return;
            if (e.type === 'touchmove') e.preventDefault(); 
            
            const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
            
            activeDragElement.style.left = (clientX - dragOffsetX) + 'px';
            activeDragElement.style.top = (clientY - dragOffsetY) + 'px';
        }

        function handleDragEnd() {
            if (activeDragElement) {
                activeDragElement.classList.remove('dragging');
                activeDragElement = null;
            }
        }

        function updateLessonOptions() {
            const grade = document.getElementById('grade-select').value;
            const lessonSelect = document.getElementById('lesson-select');
            
            lessonSelect.innerHTML = '<option value="">단원 선택</option>';
            if (!grade) return; 

            const maxLesson = (grade === "3" || grade === "4") ? 11 : 12;

            for (let i = 1; i <= maxLesson; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `Lesson ${i}`;
                lessonSelect.appendChild(option);
            }
            
            document.getElementById('word-list').value = '';
            document.getElementById('lesson-info').value = '';
        }

        function loadPresetWords() {
            const grade = document.getElementById('grade-select').value;
            const lesson = document.getElementById('lesson-select').value;
            const dataType = document.querySelector('input[name="data-type"]:checked').value;
            
            if (!grade || !lesson) return;

            const modeLabel = dataType === 'word' ? '단어' : '문장';
            document.getElementById('lesson-info').value = `${grade}학년 Lesson ${lesson} (${modeLabel})`;

            let presetWords = [];
            if (dataType === 'word') {
                presetWords = wordDatabase[grade]?.[lesson] || [];
            } else {
                presetWords = sentenceDatabase[grade]?.[lesson] || [];
            }
            
            if (presetWords.length > 0) {
                document.getElementById('word-list').value = presetWords.join('\n');
            } else {
                document.getElementById('word-list').value = '';
                document.getElementById('word-list').placeholder = `관리자가 아직 이 단원의 ${modeLabel} 데이터를 입력하지 않았습니다.\n직접 입력해주세요!`;
            }
        }

        function startGame() {
            const rawWords = document.getElementById('word-list').value;
            
            const parsedLines = rawWords.split('\n').map(w => w.trim()).filter(w => w.length > 0);
            
            if (parsedLines.length === 0) {
                showAlert("게임을 시작하려면 내용을 최소 1줄 이상 입력해주세요!");
                document.getElementById('word-list').focus();
                return;
            }

            const modeRadios = document.getElementsByName('game-mode');
            for (const radio of modeRadios) {
                if (radio.checked) {
                    currentMode = radio.value;
                    break;
                }
            }
            
            const hintRadios = document.getElementsByName('hint-mode');
            for (const radio of hintRadios) {
                if (radio.checked) {
                    isHintModeOn = (radio.value === 'on');
                    break;
                }
            }

            words = [];
            parsedLines.forEach(line => {
                let en = line;
                let ko = "";

                if (line.includes('|')) {
                    const parts = line.split('|').map(p => p.trim());
                    if (parts.length >= 2) {
                        en = parts[0];
                        ko = parts[1];
                    }
                } else if (line.includes(',')) {
                    const parts = line.split(',').map(p => p.trim());
                    if (parts.length >= 2) {
                        en = parts[0];
                        ko = parts[1];
                    }
                }

                if (currentMode === 'unjumble' && ko) {
                    words.push({ type: 'jumble', en: en, ko: ko });      
                    words.push({ type: 'translation', en: en, ko: ko }); 
                } else {
                    words.push({ type: 'standard', en: en, ko: ko });
                }
            });

            words = shuffleArray(words);

            const timeInSeconds = parseInt(document.getElementById('time').value);
            timeInMilliseconds = (timeInSeconds > 0 ? timeInSeconds : 3) * 1000;

            const lessonInfo = document.getElementById('lesson-info').value.trim();
            document.getElementById('lesson-info-display').innerText = lessonInfo;
            document.getElementById('lesson-info-display').style.display = lessonInfo ? 'block' : 'none';

            const gameScreen = document.getElementById('game-screen');
            if (['blur', 'eraser', 'mission'].includes(currentMode)) {
                gameScreen.style.backgroundColor = "#fff9e6";
                gameScreen.style.backgroundImage = "none";
                gameScreen.style.color = "#2d3436";
                document.getElementById('top-bar').style.color = "#2d3436";
                document.getElementById('lesson-info-display').style.background = "rgba(255, 255, 255, 0.8)";
                document.getElementById('progress-display').style.background = "rgba(255, 255, 255, 0.8)";
            } else {
                gameScreen.style.backgroundColor = "#1a1a1a";
                gameScreen.style.backgroundImage = "url('./stage.png'), url('./stage.png.png'), url('./stage.jpg'), url('./—Pngtree—stage spotlight effects with isolated_3596345.jpg')";
                gameScreen.style.color = "white";
                document.getElementById('top-bar').style.color = "rgba(255, 255, 255, 0.8)";
                document.getElementById('lesson-info-display').style.background = "rgba(0, 0, 0, 0.6)";
                document.getElementById('progress-display').style.background = "rgba(0, 0, 0, 0.6)";
            }

            currentWordIndex = 0;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            playCurrentWord();
        }

        function reduceBlur() {
            currentBlur -= 10;
            if(currentBlur < 0) currentBlur = 0;
            document.getElementById('blur-word').style.filter = `blur(${currentBlur}px)`;
        }

        function createUnjumbleChunk(text) {
            const btn = document.createElement('div');
            btn.className = 'unjumble-chunk';
            btn.innerText = text;
            
            btn.onclick = function() {
                if (btn.parentElement.id === 'unjumble-pool-area') {
                    document.getElementById('unjumble-answer-area').appendChild(btn);
                } else {
                    document.getElementById('unjumble-pool-area').appendChild(btn);
                }
            };
            return btn;
        }

        function playCurrentWord() {
            const currentItem = words[currentWordIndex];
            const originalWord = currentItem.en;
            const koreanHintText = currentItem.ko;

            const actionContainer = document.getElementById('action-container');
            const actionBtn = document.getElementById('main-action-btn');
            actionContainer.style.display = 'none';
            document.getElementById('answer-display').style.display = 'none';
            document.getElementById('word-display').style.display = 'none';
            document.getElementById('scramble-container').style.display = 'none';
            document.getElementById('unjumble-container').style.display = 'none';
            document.getElementById('blur-container').style.display = 'none';
            document.getElementById('eraser-container').style.display = 'none';
            document.getElementById('flashlight-overlay').style.opacity = '0';
            document.getElementById('darkness').className = '';
            document.getElementById('darkness').style.opacity = '0'; 
            
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('retry-btn').style.display = 'none';
            document.getElementById('hint-btn').style.display = 'none';

            updateProgress();
            
            // ===============================================
            // ✨ 1. 모자이크 깜빡이 (Blur) 모드
            // ===============================================
            if (currentMode === 'blur') {
                currentState = 'writing'; 
                currentBlur = 35; 

                document.getElementById('blur-container').style.display = 'block';
                document.getElementById('mission-text').style.display = 'none';
                
                const blurWord = document.getElementById('blur-word');
                
                blurWord.innerText = originalWord;
                blurWord.style.display = 'block';
                blurWord.style.filter = `blur(${currentBlur}px)`;
                blurWord.style.color = '#0984e3'; 

                // 힌트 모드 On/Off 적용
                if(isHintModeOn && koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                } else {
                    document.getElementById('blur-ko').style.display = 'none';
                }

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').style.display = 'none';
                document.getElementById('action-korean-hint').style.display = 'none';

                document.getElementById('hint-btn').style.display = 'inline-block';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                
                actionContainer.style.display = 'block';
            }
            // ===============================================
            // ✨ 2. 지우개 배틀 (Eraser) 모드
            // ===============================================
            else if (currentMode === 'eraser') {
                currentState = 'playing'; 
                document.getElementById('progress-display').style.display = 'none'; 
                
                const eraserContainer = document.getElementById('eraser-container');
                eraserContainer.style.display = 'flex';
                eraserContainer.innerHTML = '';
                
                let cardItems = [];
                words.forEach(w => {
                    if(w.en) cardItems.push(w.en);
                    if(w.ko) cardItems.push(w.ko);
                });
                cardItems = shuffleArray(cardItems); 
                
                const pastelColors = ['#ff9ff3', '#feca57', '#48dbfb', '#1dd1a1', '#ff6b6b', '#a29bfe'];
                
                cardItems.forEach((text, i) => {
                    const card = document.createElement('div');
                    card.className = 'eraser-card';
                    card.innerText = text;
                    card.style.backgroundColor = pastelColors[i % pastelColors.length];
                    
                    card.onclick = function() {
                        card.classList.add('erased');
                    };
                    eraserContainer.appendChild(card);
                });
            }
            // ===============================================
            // ✨ 3. 미션 깜빡이 (Mission) 모드
            // ===============================================
            else if (currentMode === 'mission') {
                currentState = 'writing'; 
                
                document.getElementById('blur-container').style.display = 'block';
                
                const missionText = document.getElementById('mission-text');
                missionText.innerText = missions[Math.floor(Math.random() * missions.length)];
                missionText.style.display = 'inline-block';
                
                const blurWord = document.getElementById('blur-word');

                blurWord.innerText = originalWord;
                blurWord.style.display = 'block';
                blurWord.style.filter = `blur(0px)`; 
                blurWord.style.color = '#e17055'; 
                
                // 힌트 모드 On/Off 적용
                if(isHintModeOn && koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                } else {
                    document.getElementById('blur-ko').style.display = 'none';
                }

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').style.display = 'none';
                document.getElementById('action-korean-hint').style.display = 'none';

                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                
                actionContainer.style.display = 'block';
            }
            // ===============================================
            // 🧩 4. 문장 조립 (Unjumble) 모드
            // ===============================================
            else if (currentMode === 'unjumble') {
                currentState = 'writing'; 
                const unjumbleContainer = document.getElementById('unjumble-container');
                unjumbleContainer.style.display = 'flex';
                
                const darkness = document.getElementById('darkness');
                darkness.className = 'fully-dark';
                darkness.style.opacity = '0.6'; 

                const poolArea = document.getElementById('unjumble-pool-area');
                const answerArea = document.getElementById('unjumble-answer-area');
                poolArea.innerHTML = '';
                answerArea.innerHTML = '';

                const actionMessage = document.getElementById('action-message');
                const actionKoreanHint = document.getElementById('action-korean-hint');

                if (currentItem.type === 'jumble' || currentItem.type === 'standard') {
                    unjumbleContainer.style.display = 'flex';
                    actionMessage.innerText = "단어를 클릭해 문장을 완성하라! 🧩";
                    actionContainer.className = 'action-bottom'; 

                    // 힌트 모드 On/Off 적용
                    if(isHintModeOn && koreanHintText) {
                        actionKoreanHint.innerText = `"${koreanHintText}"`;
                        actionKoreanHint.style.display = 'block';
                    } else {
                        actionKoreanHint.style.display = 'none';
                    }

                    const chunks = originalWord.split(' ').filter(c => c.trim().length > 0);
                    let shuffledChunks = shuffleArray(chunks);
                    if(chunks.length > 1) {
                        let attempts = 0;
                        while (shuffledChunks.join(' ') === chunks.join(' ') && attempts < 10) {
                            shuffledChunks = shuffleArray(chunks);
                            attempts++;
                        }
                    }
                    shuffledChunks.forEach(text => {
                        poolArea.appendChild(createUnjumbleChunk(text));
                    });
                } 
                else if (currentItem.type === 'translation') {
                    unjumbleContainer.style.display = 'none'; 
                    actionMessage.innerText = "다음 뜻에 맞는 영어 문장을 말해보자! 🗣️";
                    actionKoreanHint.innerText = `"${koreanHintText}"`;
                    actionKoreanHint.style.display = 'block'; 
                    actionContainer.className = 'action-translation'; 
                }
                
                actionBtn.innerText = "👀 정답 확인";
                actionBtn.className = 'action-btn';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            }

            // ===============================================
            else if (currentMode === 'scramble') {
                currentState = 'writing'; 
                const scrambleContainer = document.getElementById('scramble-container');
                scrambleContainer.style.display = 'block';
                
                const darkness = document.getElementById('darkness');
                darkness.className = 'fully-dark';
                darkness.style.opacity = '0.6'; 

                const placedPositions = [];
                const minDistance = 14; 
                const chars = originalWord.split('');
                chars.forEach(char => {
                    if(char.trim() === '') return; 
                    const span = document.createElement('span');
                    span.innerText = char;
                    span.className = 'scattered-letter';

                    let top, left;
                    let attempts = 0;
                    let validPosition = false;

                    while (!validPosition && attempts < 50) {
                        top = 20 + Math.random() * 40; 
                        left = 10 + Math.random() * 70;  
                        validPosition = true;
                        for (let pos of placedPositions) {
                            const dx = pos.left - left;
                            const dy = pos.top - top; 
                            if (Math.sqrt(dx*dx + dy*dy) < minDistance) {
                                validPosition = false; 
                                break;
                            }
                        }
                        attempts++;
                    }

                    placedPositions.push({top, left});
                    span.style.top = `${top}%`;
                    span.style.left = `${left}%`;
                    span.style.transform = `rotate(${-15 + Math.random() * 30}deg)`;

                    span.addEventListener('mousedown', handleDragStart);
                    span.addEventListener('touchstart', handleDragStart, {passive: false});

                    scrambleContainer.appendChild(span);
                });

                actionContainer.className = 'action-bottom';
                document.getElementById('action-message').innerText = "Guess the Word! 🤔";
                document.getElementById('action-message').style.display = 'block';
                
                // 힌트 모드 On/Off 적용
                if(isHintModeOn && koreanHintText) {
                    document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                    document.getElementById('action-korean-hint').style.display = 'block';
                } else {
                    document.getElementById('action-korean-hint').style.display = 'none'; 
                }
                
                actionBtn.innerText = "👀 정답 확인";
                actionBtn.className = 'action-btn';
                document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
                
                setTimeout(() => { actionContainer.style.display = 'block'; }, 300);
            } 
            // ===============================================
            // 🔦 6. 손전등 (Flashlight) 모드
            // ===============================================
            else {
                currentState = 'showing';
                
                const wordDisplay = document.getElementById('word-display');
                wordDisplay.innerText = originalWord;
                wordDisplay.style.display = 'block';
                
                const darkness = document.getElementById('darkness');
                darkness.className = '';
                darkness.style.opacity = '1';
                
                setTimeout(() => {
                    if(currentState === 'showing') {
                        darkness.classList.add('spotlight-on');
                        document.getElementById('flashlight-overlay').style.opacity = '1'; 
                    }
                }, 500);

                timerId = setTimeout(() => {
                    showWritePrompt();
                }, timeInMilliseconds + 500);
            }
        }

        function showWritePrompt() {
            currentState = 'writing';
            const currentItem = words[currentWordIndex];
            const koreanHintText = currentItem.ko;

            const darkness = document.getElementById('darkness');
            darkness.className = 'fully-dark';
            darkness.style.opacity = '1';
            document.getElementById('flashlight-overlay').style.opacity = '0'; 
            document.getElementById('word-display').style.display = 'none';

            const actionContainer = document.getElementById('action-container');
            actionContainer.className = 'action-center';
            document.getElementById('action-message').innerText = "Time to Write! ✍️";
            document.getElementById('action-message').style.display = 'block';
            
            // 힌트 모드 On/Off 적용
            if(isHintModeOn && koreanHintText) {
                document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                document.getElementById('action-korean-hint').style.display = 'block';
            } else {
                document.getElementById('action-korean-hint').style.display = 'none'; 
            }
            
            const actionBtn = document.getElementById('main-action-btn');
            actionBtn.innerText = "👀 정답 확인";
            actionBtn.className = 'action-btn';
            
            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
            document.getElementById('retry-btn').style.display = 'inline-block';
            
            setTimeout(() => { actionContainer.style.display = 'block'; }, 500);
        }

        function handleActionClick() {
            if (currentState === 'writing') {
                if (['blur', 'mission'].includes(currentMode)) {
                    showAnswer();
                } else {
                    showAnswer();
                }
            } else if (currentState === 'answered') {
                nextWord();
            }
        }

        function showAnswer() {
            currentState = 'answered';
            const currentItem = words[currentWordIndex];
            const koreanHintText = currentItem.ko;
            const actionContainer = document.getElementById('action-container');
            const actionBtn = document.getElementById('main-action-btn');
            
            document.getElementById('scramble-container').style.display = 'none';
            document.getElementById('unjumble-container').style.display = 'none';

            // 워밍업 모드일 경우 정답 표시 방식
            if (['blur', 'mission'].includes(currentMode)) {
                document.getElementById('blur-word').style.filter = 'blur(0px)';
                document.getElementById('hint-btn').style.display = 'none';

                document.getElementById('blur-word').innerText = currentItem.en;
                document.getElementById('blur-word').style.display = 'block';
                document.getElementById('blur-word').style.color = '#0984e3'; 
                
                if(koreanHintText) {
                    document.getElementById('blur-ko').innerText = koreanHintText;
                    document.getElementById('blur-ko').style.display = 'block';
                }
                
                actionBtn.innerText = currentWordIndex < words.length - 1 ? "다음 문제 ➔" : "🎉 게임 종료";
                actionBtn.className = currentWordIndex < words.length - 1 ? 'action-btn next-btn' : 'action-btn end-btn';
                return; 
            }

            // 심화 학습 모드 정답 표시 방식
            if (currentMode === 'unjumble' && currentItem.type === 'translation') {
                actionContainer.className = 'action-translation';
            } else {
                actionContainer.className = 'action-center';
            }

            document.getElementById('action-message').style.display = 'none';
            
            if(koreanHintText) {
                document.getElementById('action-korean-hint').innerText = `"${koreanHintText}"`;
                document.getElementById('action-korean-hint').style.display = 'block';
            } else {
                document.getElementById('action-korean-hint').style.display = 'none'; 
            }
            
            document.getElementById('hint-btn').style.display = 'none';
            
            const answerDisplay = document.getElementById('answer-display');
            answerDisplay.innerText = currentItem.en; 
            answerDisplay.style.display = 'flex';

            document.getElementById('prev-btn').style.display = currentWordIndex > 0 ? 'inline-block' : 'none';
            document.getElementById('retry-btn').style.display = 'inline-block';

            if (currentWordIndex < words.length - 1) {
                actionBtn.innerText = "다음 문제 ➔";
                actionBtn.className = 'action-btn next-btn';
            } else {
                actionBtn.innerText = "🎉 게임 종료";
                actionBtn.className = 'action-btn end-btn';
            }
        }

        function nextWord() {
            if (currentWordIndex < words.length - 1) {
                currentWordIndex++;
                playCurrentWord();
            } else {
                resetGame();
            }
        }

        function prevWord() {
            if (currentWordIndex > 0) {
                clearTimeout(timerId);
                currentWordIndex--;
                playCurrentWord();
            }
        }

        function retryProblem() {
            clearTimeout(timerId);
            playCurrentWord();
        }

        function updateProgress() {
            document.getElementById('progress-display').innerText = `Word ${currentWordIndex + 1} / ${words.length}`;
        }

        function resetGame() {
            clearTimeout(timerId);
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('progress-display').style.display = 'block'; 
            
            document.getElementById('scramble-container').innerHTML = '';
            document.getElementById('scramble-container').style.display = 'none';
            document.getElementById('unjumble-container').style.display = 'none';
            document.getElementById('blur-container').style.display = 'none';
            document.getElementById('eraser-container').style.display = 'none';
            document.getElementById('flashlight-overlay').style.opacity = '0';
        }

        function quitGame() {
            showConfirm("정말로 게임을 종료하고 처음으로 돌아가시겠습니까?", function() {
                resetGame();
            });
        }
    </script>
</body>
</html>
